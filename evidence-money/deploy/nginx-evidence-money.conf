# H6326 — evidence money витрина. Tailscale-only + basic auth (152-FZ fence).
# Bind the LAN interface ONLY (192.168.200.92) — unreachable from the public
# internet and from the tailnet directly; MG reaches it over the tailnet via
# SSH tunnel:  ssh -L 8420:192.168.200.92:8420 root@100.85.73.83
# Belt (private interface) + braces (basic auth).
server {
    listen 192.168.200.92:8420;
    server_name evidence-money.lan;

    root /opt/evidence-money/build;
    index index.html;

    auth_basic "evidence money (MG only)";
    auth_basic_user_file /etc/nginx/evidence-money.htpasswd;

    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        try_files $uri $uri/ =404;
    }
}
