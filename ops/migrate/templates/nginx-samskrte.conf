# Fallback-vhost samskrte.ru для нового бокса (до certbot).
# ПРИОРИТЕТ: если в снапшоте есть /etc/nginx — 05-services.sh берёт его,
# этот файл используется только когда восстанавливать нечего.
server {
    listen 80;
    server_name samskrte.ru www.samskrte.ru;
    root /var/www/html/app/public;
    index index.php index.html;

    charset utf-8;
    client_max_body_size 100M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm-migrate.sock;
        fastcgi_read_timeout 120s;
    }

    # защищённые материалы (записи уроков) отдаются через контроллер —
    # прямой доступ к storage закрыт, как на проде
    location ^~ /storage/app/private/ { deny all; }

    # H4663 (аудит периметра 14-09, п.6): раньше фолбэк-вхост поднимался без
    # security-заголовков, тогда как живой прод их отдаёт. Перенесены с прода:
    # при пересборке бокса без снапшота /etc/nginx сайт не теряет эшелон.
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
    # HSTS держать ТОЛЬКО на https-вхосте; в этом фолбэке нет 443-сервера,
    # поэтому Strict-Transport-Security не добавляем (на http он бесполезен).

    error_log  /var/log/nginx/samskrte-error.log warn;
    access_log /var/log/nginx/samskrte-access.log;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
}
