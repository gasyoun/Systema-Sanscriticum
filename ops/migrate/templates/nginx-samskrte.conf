# Fallback-vhost samskrte.ru для нового бокса (до certbot).
# ПРИОРИТЕТ: если в снапшоте есть /etc/nginx — 05-services.sh берёт его,
# этот файл используется только когда восстанавливать нечего.
server {
    listen 80;
    server_name samskrte.ru www.samskrte.ru;
    root /var/www/html/app/public;
    index index.php index.html;

    charset utf-8;
    client_max_body_size 100M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm-migrate.sock;
        fastcgi_read_timeout 120s;
    }

    # защищённые материалы (записи уроков) отдаются через контроллер —
    # прямой доступ к storage закрыт, как на проде
    location ^~ /storage/app/private/ { deny all; }

    error_log  /var/log/nginx/samskrte-error.log warn;
    access_log /var/log/nginx/samskrte-access.log;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
}
