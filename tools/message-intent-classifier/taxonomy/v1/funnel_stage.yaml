# Таксономия плоскости funnel_stage — куда сообщение ведёт по воронке.
# H4609: ключи 1:1 из ORS-FAQ
# docs/INTENT_TAG_OUTCOME_REGISTER_AND_ATTRIBUTION_W0_2026-09-06.md:
# два одобренных исхода (course, consultation) + serve_only (обслуживание без
# маршрутизации). «Nothing routes anywhere else» — других исходов нет.
plane: funnel_stage
categories:
  - key: course
    title: "Ведёт на каталог курсов"
    description: "Стоимость, оплата, запись, расписание группы, депозит — активная покупательская оценка (суммарно 2690 диалогов в регистре)."
  - key: consultation
    title: "Ведёт к куратору-консультанту"
    description: "Записи уроков («отстал от группы»), пауза, возврат — нужен живой ответ до churn (719 диалогов в регистре)."
  - key: serve_only
    title: "Обслуживание без маршрутизации"
    description: "Zoom-ссылка, техпроблемы, материалы, доступ/кабинет — механика поддержки, маршрутизация добавляет шум (815 диалогов в регистре)."
