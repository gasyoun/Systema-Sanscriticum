# Таксономия плоскости resolution — класс разрешения запроса.
# H4609: выравнивание с H4404 (Systema SupportDmAutoReply): R3 refuse-гейты —
# деньги/политика (легаси-D) и доступ (легаси-E) refuse-and-escalate, никогда
# не автоотправка -> needs_human; живое FAQ-включение категории F
# (FAQ-live-F, порог 15.7, работает с H3799) -> faq_hit; легаси A/B/C
# (zoom, записи, расписание) — шаблонная рука -> auto_answerable.
plane: resolution
categories:
  - key: auto_answerable
    title: "Отвечается шаблоном/ботом"
    description: "Zoom-ссылка, подключения, расписание, записи — легаси-руки A/B/C с готовыми ответами."
  - key: faq_hit
    title: "Попадание в FAQ"
    description: "Материалы/ДЗ/сертификаты — легаси-F, ветка FAQ live-F перед любым черновиком (H4404)."
  - key: needs_human
    title: "Только человек"
    description: "Оплата/тарифы/возврат (легаси-D) и доступ/кабинет (легаси-E) — R3 refuse-and-escalate, авто-отправка запрещена."
