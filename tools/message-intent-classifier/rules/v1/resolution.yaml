# Правила плоскости resolution — класс разрешения запроса (H4404-выравнивание).
# R3 refuse-гейты: деньги/политика (легаси-D SupportAnswerSuggestion) и
# доступ (легаси-E) — refuse-and-escalate, никогда не автоотправка =>
# needs_human. FAQ-live-F (категория F, порог 15.7, живая с H3799) =>
# faq_hit. Легаси-A/B/C (zoom, записи, расписание) — шаблонная рука =>
# auto_answerable. Refuse-классы проверяются первыми: «оплата не работает»
# — needs_human (D), а не auto.
rules:
  - plane: resolution
    category: needs_human
    priority: 10
    patterns:
      - 'оплат|тариф|цен|стои|рассрочк|скидк|промокод'
      - 'депозит|взнос|возврат|верните? деньги|вернуть деньги'
      - 'пауз[а-я]*|приостанов[а-я]*'
      - 'кабинет|парол|логин|нет доступа|вход|не могу (войти|попасть|зайти)'
    source: >-
      H4404 R3: «money/policy (D) and access (E) topics refuse-and-escalate,
      never auto-sent» — оплата и доступ только человеком.
  - plane: resolution
    category: faq_hit
    priority: 20
    patterns:
      - 'материал|методичк|конспект|презентац|учебник|раздаточ'
      - 'сертификат|диплом|удостоверен'
      - 'домашн|домашк|(?<![а-я])дз(?![а-я])|задани'
    source: >-
      H4404: «FAQ live-F branch (15.7 floor) runs BEFORE the LLM draft» —
      легаси-F (материалы/ДЗ/сертификаты) разрешается попаданием в FAQ.
  - plane: resolution
    category: auto_answerable
    priority: 30
    patterns:
      - 'зум|zoom|подключ|ссылк|линк'
      - 'расписан|во ?сколько|когда (занятие|урок|старт|начн)'
      - 'видеозапис|запис[а-я]*|пересмотр|тайм ?код'
    source: >-
      H4404: легаси-руки A/B/C (zoom, записи, расписание) — категория null в
      8/8 live dm_hinted (H3380) означала отсутствие классификатора, не
      отказ шаблонов; эти темы отвечаются готовыми шаблонами.
