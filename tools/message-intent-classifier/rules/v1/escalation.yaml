# Правила плоскости escalation — градиент срочности/риска в диалоге.
# Канонический источник канала: ors_faq/escalation.py (_ESCALATION_PATTERNS:
# «куратор, живой, человек, напишите мне, позвоните, реальный, админ,
# оператор, (?<!тех)поддержк» — та же механика «pattern+negation», что и в
# meta/human_trigger). Классы: churn_risk и frustrated — приоритетная
# лексика жалоб (intent/complaint: «верните деньги|обман|мошенник|
# игнорируете») и pre-churn тегов 07_пауза/08_возврат (DROPOFF_TAXONOMY_2026);
# calm — вежливый регистр/спокойная просьба о человеке. Сильные эмоции
# проверяются раньше вежливости.
rules:
  - plane: escalation
    category: churn_risk
    priority: 10
    patterns:
      - 'верните? деньги|вернуть деньги|возврат (средств|денег|оплат)'
      - 'отмен(ить|а) (заказ|платеж|подписк|курс)|отменить всё'
      - 'не хочу (продолжать|учиться|заниматься)|бросить курс|уходу из'
      - 'отписаться от (курса|занятий|рассылки курса)|расторж[а-я]*'
      - 'не буду (платить|заниматься|учиться)'
    source: >-
      H4609: лексика pre-churn (07_пауза/08_возврат регистра W0,
      DROPOFF_TAXONOMY_2026) + intent/complaint «верните деньги»;
      «отписаться от рассылки» (i-sp-01) специально НЕ churn_risk.
  - plane: escalation
    category: frustrated
    priority: 20
    patterns:
      - 'опять|снова не|никто не отвечает|игнорируете'
      - 'сколько можно|когда уже|уже (час|два|три|неделю|месяц)'
      - 'возмут[а-я]*|безобрази[а-я]*|надоело|обман|мошенник'
      - 'третий раз|второй раз пишу'
    source: >-
      H4609: маркеры повторной жалобы из intent/complaint-набора
      («обман|мошенник|игнорируете») + частотные раздражители; канал эскалации
      см. escalation.py (calm-просьба о человеке — ниже).
  - plane: escalation
    category: calm
    priority: 30
    patterns:
      - 'пожалуйста|подскажите|будьте добры|буду благодарн[а-я]*'
      - 'здравствуйте|добрый день|спасибо|благодарю'
      - 'куратор|живой|напишите мне|позвоните'
    source: >-
      H4609: вежливый регистр + спокойная просьба о человеке — дословные
      паттерны ors_faq/escalation.py (_ESCALATION_PATTERNS: куратор, живой,
      напишите мне, позвоните; «техподдержка» — FAQ-тема, не эскалация).
