# Правила плоскости funnel_stage — исход маршрутизации по регистру W0.
# Источник ключей: ORS-FAQ docs/INTENT_TAG_OUTCOME_REGISTER_AND_ATTRIBUTION_
# W0_2026-09-06.md (H4233): course-исход несут теги 01_оплата, 02_стоимость,
# 03_запись, 06_расписание, 09_депозит (2690 диалогов); consultation —
# 05_записи_уроков, 07_пауза, 08_возврат (719); serve-only — 04_ссылка_zoom,
# 10_техпроблемы, 11_материалы (815). Доступ/кабинет в регистре темы не имеет
# — по правилу «Nothing routes anywhere else» это serve_only.
# Порядок = приоритет: course раньше consultation (запись на курс ≠ записи
# уроков), consultation раньше serve_only («ссылка на запись» — consultation).
rules:
  - plane: funnel_stage
    category: course
    priority: 10
    patterns:
      - 'оплат|тариф|цен|стои|скидк|промокод'
      - 'рассрочк|депозит|взнос|частями'
      - 'сколько стоит|сколько.{0,24}стои|стоимост'
      - 'записаться|запишусь|запись на курс'
      - 'расписан|во ?сколько|когда (занятие|урок|старт|начн)'
    source: >-
      H4609: регистр W0 — course-исход (02_стоимость/01_оплата/03_запись/
      06_расписание/09_депозит): «price question = active purchase
      evaluation», «first-contact enrollment intent — the hottest tag».
  - plane: funnel_stage
    category: consultation
    priority: 20
    patterns:
      - 'видеозапис|пересмотр|переслуш|тайм ?код|в каком видео'
      - 'запис[а-я]*'
      - 'пауз[а-я]*|приостанов[а-я]*|замороз'
      - 'возврат|верните? деньги|вернуть деньги'
    negations:
      - 'записаться|запишусь|запись на курс'
      - 'техподдержк|не работает|не открыва'
    source: >-
      H4609: регистр W0 — consultation-исход (05_записи_уроков: «отстал от
      группы» anxiety, 07_пауза: pre-churn, 08_возврат: risk state — «only a
      human should answer»). Negation держит онбординг-«запись на курс» в
      course p10, а «запись не работает/техподдержка» — в serve_only
      (10_техпроблемы, как в golden t-neg-01).
  - plane: funnel_stage
    category: serve_only
    priority: 30
    patterns:
      - 'зум|zoom|подключ'
      - 'техподдержк|не работает|не открыва|ошибк|сбой|виснет|вылетает'
      - 'материал|методичк|конспект|презентац|учебник'
      - 'кабинет|парол|логин|вход|домашн|дз|сертификат|диплом'
      - 'клуб|подписк|членство'
    source: >-
      H4609: регистр W0 — serve-only (04_ссылка_zoom: «access mechanics;
      routing adds noise», 10_техпроблемы, 11_материалы). Доступ/кабинет —
      вне 11 тегов регистра; «Nothing routes anywhere else» => serve_only.
