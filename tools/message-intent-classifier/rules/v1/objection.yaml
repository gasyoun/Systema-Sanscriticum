# Правила плоскости objection (коды B1–B11, FAQ_FUNNEL_OBJECTION_MAP).
# Порядок несёт семантику sufler.py: деньги раньше сомнения в себе; пробное/
# возврат раньше общего «записи»; «не успею к потоку» — B6, не B1.
# Отступления от sufler-маркеров (поддержка, не преседа):
#   - из B2 убраны голые 'оплатить/деньг/стоит' («хочу оплатить» = buy_signal,
#     а не возражение о цене);
#   - из B1 убраны 'записи/записаться/запишусь' (в поддержке это записи-уроков
#     и онбординг, не страх времени);
#   - 'подойде' из B9 заменён на 'не подойдет/а вдруг' (позитивное «мне
#     подходит?» — вопрос подбора B5, не риск).
rules:
  - plane: objection
    category: b8_payment_mechanics
    priority: 12
    patterns:
      - 'как записаться|как оплатить|где оплат'
      - 'куда платить|куда писать|реквизит[а-я]*|как заплатить'
    source: FAQ карта В8 (механика оплаты/записи); раньше B1/B2, чтобы «как записаться» не падал в время/цену
  - plane: objection
    category: b2_price
    priority: 15
    patterns:
      - 'сколько стоит|сколько.{0,24}стои'
      - '(?<![а-я])дорог(о|а|ой|ие)(?![а-я])|скидк[а-я]*|рассрочк[а-я]*'
      - 'не потян[а-я]*|нет денег|мало денег|цена кусается'
      - '(?<![а-я])цен[ауыое](?![а-я])'
    source: sufler В2 (money stems first); минус голые оплатить/деньг/стоит — см. шапку
  - plane: objection
    category: b9_risk_trial
    priority: 20
    patterns:
      - 'пробн[а-я]*|возврат[а-я]*'
      - 'вернете деньги|вернуть деньги'
      - 'не подойдет|если не подойдет|а вдруг'
      - 'рискованно|страшно платить'
    source: sufler В9 (trial/refund before generic time-markers)
  - plane: objection
    category: b3_self_doubt
    priority: 25
    patterns:
      - 'осил[а-я]*|справлюсь|способност[а-я]*'
      - 'не поздно|сложн[а-я]* для меня|слишком сложн'
      - 'боюсь|переживаю|в моем возрасте|не рано ли|память уже'
    source: sufler В3
  - plane: objection
    category: b6_start_date
    priority: 30
    patterns:
      - 'старт[а-я]*|поток[а-я]*|набор[а-я]*|наберет'
      - 'когда начина[а-я]*|начинаете|дата старта'
      - 'успе[а-я]* к потоку|присоединиться позже|курс уже идет'
    source: sufler В6; «не успею к потоку» ловится здесь раньше B1
  - plane: objection
    category: b1_time
    priority: 35
    patterns:
      - 'нет времени|не хватает времени'
      - 'не успе[а-я]*|пропу[стщ][а-я]*'
      - 'не смогу присутствовать|присутствовать на'
      - 'в отъезде|командировк[а-я]*|буду занят'
    source: sufler В1 (минус записи-семейство — см. шапку); возражение №1 (285)
  - plane: objection
    category: b4_purpose
    priority: 40
    patterns:
      - 'зачем мне|зачем учить|зачем санскрит'
      - 'что это мне даст|что мне даст|для чего мне'
      - 'стоит ли учить|есть ли смысл'
    source: FAQ карта В4 (разовый интерес 869 @ 20%)
  - plane: objection
    category: b5_course_fit
    priority: 45
    patterns:
      - 'какой курс|что выбрать|как выбрать курс'
      - 'мой уровень|какой уровень|с нуля ли|возьмете с нуля|полный ноль'
      - 'мне подходит|курс подходит'
    source: FAQ карта В5 (конкретный текст 638 @ 32%)
  - plane: objection
    category: b7_logistics
    priority: 50
    patterns:
      - 'за рубеж|за границ|из другого города|из другого региона'
      - 'часовой пояс|по моему времени'
      - 'технически получится|с телефона получится'
    source: FAQ карта В7 (17% за рубежом, конверсия 44%)
  - plane: objection
    category: b11_what_next
    priority: 55
    patterns:
      - 'после курса|что дальше'
      - 'следующ(ий|ая) (курс|ступен)|продолжить обучение|куда расти'
    source: FAQ карта В11 (продолжающие 72%)
  - plane: objection
    category: b10_trust
    priority: 60
    patterns:
      - 'секта|религи[а-я]*'
      - 'кто вы такие|настоящий ли|это правда вы'
      - 'почему вам можно верить|не разведете'
    source: FAQ карта В10 (доверие; светский подход)
