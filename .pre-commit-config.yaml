repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: local
    hooks:
      - id: changelog-duplicate-bullets
        name: CHANGELOG.md has no duplicated bullets
        entry: python scripts/changelog_duplicate_bullets.py
        language: system
        files: ^changelog\.md$
        pass_filenames: false
