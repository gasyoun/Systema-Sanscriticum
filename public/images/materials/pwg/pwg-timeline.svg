<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" font-family="Georgia, 'Times New Roman', serif">
  <style>
    .t { fill: #2b2115; font-size: 16px; }
    .b { font-weight: bold; font-size: 17px; }
    .s { fill: #6b5d49; font-size: 13.5px; font-style: italic; }
    .axis { stroke: #8a6d3b; stroke-width: 3; }
    .tick { stroke: #8a6d3b; stroke-width: 2; }
    .dot { fill: #6b4f1d; }
  </style>
  <text x="450" y="34" text-anchor="middle" class="t b" font-size="23">Полтора века одной книги</text>

  <line class="axis" x1="60" y1="180" x2="840" y2="180"/>

  <circle class="dot" cx="100" cy="180" r="7"/>
  <line class="tick" x1="100" y1="180" x2="100" y2="120"/>
  <text x="100" y="105" text-anchor="middle" class="t b">1852</text>
  <text x="100" y="96" text-anchor="middle" class="s" font-size="0">.</text>
  <text x="100" y="212" text-anchor="middle" class="s">первые листы
    <tspan x="100" dy="17">в наборе</tspan></text>

  <circle class="dot" cx="205" cy="180" r="7"/>
  <line class="tick" x1="205" y1="180" x2="205" y2="120"/>
  <text x="205" y="105" text-anchor="middle" class="t b">1855</text>
  <text x="205" y="212" text-anchor="middle" class="s">том I,
    <tspan x="205" dy="17">«Гласные»</tspan></text>

  <circle class="dot" cx="360" cy="180" r="7"/>
  <line class="tick" x1="360" y1="180" x2="360" y2="120"/>
  <text x="360" y="105" text-anchor="middle" class="t b">1875</text>
  <text x="360" y="212" text-anchor="middle" class="s">том VII —
    <tspan x="360" dy="17">словарь завершён</tspan></text>

  <circle class="dot" cx="470" cy="180" r="7"/>
  <line class="tick" x1="470" y1="180" x2="470" y2="120"/>
  <text x="470" y="105" text-anchor="middle" class="t b">1879–89</text>
  <text x="470" y="212" text-anchor="middle" class="s">«малый
    <tspan x="470" dy="17">Петербургский»</tspan></text>

  <circle class="dot" cx="580" cy="180" r="7"/>
  <line class="tick" x1="580" y1="180" x2="580" y2="120"/>
  <text x="580" y="105" text-anchor="middle" class="t b">1928</text>
  <text x="580" y="212" text-anchor="middle" class="s">«Дополнения»
    <tspan x="580" dy="17">Шмидта</tspan></text>

  <circle class="dot" cx="700" cy="180" r="7"/>
  <line class="tick" x1="700" y1="180" x2="700" y2="120"/>
  <text x="700" y="105" text-anchor="middle" class="t b">1994</text>
  <text x="700" y="212" text-anchor="middle" class="s">старт оцифровки
    <tspan x="700" dy="17">в Кёльне</tspan></text>

  <circle class="dot" cx="810" cy="180" r="7"/>
  <line class="tick" x1="810" y1="180" x2="810" y2="120"/>
  <text x="810" y="105" text-anchor="middle" class="t b">2026</text>
  <text x="810" y="212" text-anchor="middle" class="s">перевод на русский
    <tspan x="810" dy="17">и английский</tspan></text>

  <text x="450" y="320" text-anchor="middle" class="s">Печать семи томов: 1855 · 1858 · 1861 · 1865 · 1868 · 1871 · 1875</text>
</svg>
