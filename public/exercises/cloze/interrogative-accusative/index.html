<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Санскрит · Аккузатив вопросительных местоимений</title>
<link rel="stylesheet" href="../engine.css">
<style>
  body { margin: 0; background: var(--page-bg, #f3ecdb); }
  @media (prefers-color-scheme: dark) { body { background: #1c1712; } }
  :root[data-theme="dark"] body { background: #1c1712; }
  :root[data-theme="light"] body { background: #f3ecdb; }
  .page { max-width: 900px; margin: 0 auto; padding: 28px 20px 60px; }
  .eyebrow {
    font-family: "Noto Sans Devanagari","Nirmala UI",serif;
    font-size: 13px; letter-spacing: .16em; color: #a8451f; font-weight: 600; margin: 0 0 6px;
  }
  @media (prefers-color-scheme: dark) { .eyebrow { color: #e07a4e; } }
  :root[data-theme="dark"] .eyebrow { color: #e07a4e; }
  h1 {
    font-family: "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif; font-weight: 600;
    font-size: clamp(26px, 4.5vw, 40px); margin: 0 0 18px; color: #2a2118; text-wrap: balance;
  }
  @media (prefers-color-scheme: dark) { h1 { color: #efe6d4; } }
  :root[data-theme="dark"] h1 { color: #efe6d4; }
  footer { margin-top: 34px; padding-top: 16px; border-top: 1px solid #d9cba8; font-size: 12.5px; color: #6b5d47; }
  footer a { color: #a8451f; }
  @media (prefers-color-scheme: dark) { footer { border-color: #423628; color: #b3a488; } footer a { color: #e07a4e; } }
  :root[data-theme="dark"] footer { border-color: #423628; color: #b3a488; }
</style>
</head>
<body>
<div class="page">
  <p class="eyebrow">संस्कृतम् · किम्</p>
  <h1>Аккузатив вопросительных местоимений</h1>
  <div id="app"></div>
  <footer>
    Замените существительные соответствующими вопросительными местоимениями в аккузативе.
    <!-- LearningApps source: https://learningapps.org/display?v=pbyg2mx7n25 -->
    Учебный виджет Systema&nbsp;Sanscriticum.
  </footer>
</div>

<script src="/exercises/gate.js" defer></script>
<script src="/exercises/telemetry.js" data-drill="cloze" data-band="interrogative-accusative" defer></script>
<script src="../engine.js"></script>
<script>
  ClozeExercise.mount(document.getElementById("app"), {
    task: "Замените существительные соответствующими вопросительными местоимениями.",
    feedback: "Отлично, верное решение!",
    segments: [
      "बालौ बालाः पश्यतः। ",
      { options: ["कौ", "किम्", "का"], answer: 0 },
      " ",
      { options: ["काः", "कौ", "के"], answer: 0 },
      " पश्यतः॥ बाले बालान् पश्यतः । ",
      { options: ["के", "किम्", "कः"], answer: 0 },
      " ",
      { options: ["कान्", "का", "कः"], answer: 0 },
      " पश्यतः॥\n\nकपयः फलानि खादन्ति । ",
      { options: ["के", "का", "किम्"], answer: 0 },
      " ",
      { options: ["कानि", "कौ", "के"], answer: 0 },
      " खादन्ति॥ सीता श्लोकान् लिखति । ",
      { options: ["का", "कौ", "किम्"], answer: 0 },
      " ",
      { options: ["कान्", "कौ", "का"], answer: 0 },
      " लिखति॥\n\nछात्राः लताः आनयन्ति । ",
      { options: ["के", "का", "किम्"], answer: 0 },
      " ",
      { options: ["काः", "के", "का"], answer: 0 },
      " आनयन्ति॥ नृपतयः अश्वान् आरोहन्ति । ",
      { options: ["के", "का", "किम्"], answer: 0 },
      " ",
      { options: ["कान्", "का", "किम्"], answer: 0 },
      " आरोहन्ति॥\n\nसारथिः रथं नयति । ",
      { options: ["कः", "के", "किम्"], answer: 0 },
      " ",
      { options: ["कम्", "का", "किम्"], answer: 0 },
      " नयति ॥ कन्या मालां करोति । ",
      { options: ["का", "कौ", "किम्"], answer: 0 },
      " ",
      { options: ["काम्", "के", "का"], answer: 0 },
      " करोति॥\n"
    ]
  });
</script>
</body>
</html>
