<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Санскрит · Найди пару для глагола</title>
<link rel="stylesheet" href="../engine.css">
<style>
  body { margin: 0; background: #f3ecdb; }
  @media (prefers-color-scheme: dark) { body { background: #1c1712; } }
  :root[data-theme="dark"] body { background: #1c1712; }
  :root[data-theme="light"] body { background: #f3ecdb; }
  .page { max-width: 1000px; margin: 0 auto; padding: 28px 20px 60px; }
  .eyebrow {
    font-family: "Noto Sans Devanagari","Nirmala UI",serif;
    font-size: 13px; letter-spacing: .16em; color: #a8451f; font-weight: 600; margin: 0 0 6px;
  }
  @media (prefers-color-scheme: dark) { .eyebrow { color: #e07a4e; } }
  :root[data-theme="dark"] .eyebrow { color: #e07a4e; }
  h1 {
    font-family: "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif; font-weight: 600;
    font-size: clamp(26px, 4.5vw, 40px); margin: 0 0 18px; color: #2a2118; text-wrap: balance;
  }
  @media (prefers-color-scheme: dark) { h1 { color: #efe6d4; } }
  :root[data-theme="dark"] h1 { color: #efe6d4; }
  footer { margin-top: 34px; padding-top: 16px; border-top: 1px solid #d9cba8; font-size: 12.5px; color: #6b5d47; }
  footer a { color: #a8451f; }
  @media (prefers-color-scheme: dark) { footer { border-color: #423628; color: #b3a488; } footer a { color: #e07a4e; } }
  :root[data-theme="dark"] footer { border-color: #423628; color: #b3a488; }
</style>
</head>
<body>
<div class="page">
  <p class="eyebrow">संस्कृतम् · धातवः</p>
  <h1>Найди пару для глагола</h1>
  <div id="app"></div>
  <footer>
    11 глагольных корней и их формы 3&nbsp;лица единственного числа настоящего времени.
    Соедините каждый корень с его формой; подсказки дают короткий русский перевод.
    Учебный виджет Systema&nbsp;Sanscriticum.
  </footer>
</div>

<script src="/exercises/gate.js" defer></script>
<script src="/exercises/telemetry.js" data-drill="match" data-band="verb-roots" defer></script>
<script src="../engine.js"></script>
<script>
  MatchExercise.mount(document.getElementById("app"), {
    task: "Найдите для каждого глагольного корня форму 3 лица единственного числа. " +
          "Нажмите карточку слева, затем её пару справа — или перетащите одну на другую.",
    feedback: "Задание решено верно. Все корни соединены со своими формами.",
    leftTitle: "Формы (3 л. ед. ч.)",
    rightTitle: "Корни",
    pairs: [
      { left: { text: "स्फुरति" }, right: { text: "sphur-", hint: "дрожать, трепетать" } },
      { left: { text: "पठति" },   right: { text: "paṭh-",  hint: "читать" } },
      { left: { text: "गच्छति" }, right: { text: "gam-",   hint: "идти" } },
      { left: { text: "विकसति" }, right: { text: "vikas-", hint: "распускаться, расцветать" } },
      { left: { text: "लसति" },   right: { text: "las-",   hint: "сиять, играть" } },
      { left: { text: "म्लायति" }, right: { text: "mlā-",   hint: "вянуть" } },
      { left: { text: "पुष्प्यति" }, right: { text: "puṣp-", hint: "цвести" } },
      { left: { text: "वदति" },   right: { text: "vad-",   hint: "говорить" } },
      { left: { text: "फलति" },   right: { text: "phal-",  hint: "плодоносить" } },
      { left: { text: "तिष्ठति" }, right: { text: "sthā-",  hint: "стоять" } },
      { left: { text: "करोति" },  right: { text: "kṛ-",    hint: "делать" } }
    ]
  });
</script>
</body>
</html>
