<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Санскрит · Перевод с русского</title>
<link rel="stylesheet" href="../engine.css">
<style>
  body { margin: 0; background: var(--page-bg, #f3ecdb); }
  @media (prefers-color-scheme: dark) { body { background: #1c1712; } }
  :root[data-theme="dark"] body { background: #1c1712; }
  :root[data-theme="light"] body { background: #f3ecdb; }
  .page { max-width: 1000px; margin: 0 auto; padding: 28px 20px 60px; }
  .eyebrow {
    font-family: "Noto Sans Devanagari","Nirmala UI",serif;
    font-size: 13px; letter-spacing: .16em; color: #a8451f; font-weight: 600; margin: 0 0 6px;
  }
  @media (prefers-color-scheme: dark) { .eyebrow { color: #e07a4e; } }
  :root[data-theme="dark"] .eyebrow { color: #e07a4e; }
  h1 {
    font-family: "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif; font-weight: 600;
    font-size: clamp(26px, 4.5vw, 40px); margin: 0 0 18px; color: #2a2118; text-wrap: balance;
  }
  @media (prefers-color-scheme: dark) { h1 { color: #efe6d4; } }
  :root[data-theme="dark"] h1 { color: #efe6d4; }
  footer { margin-top: 34px; padding-top: 16px; border-top: 1px solid #d9cba8; font-size: 12.5px; color: #6b5d47; }
  footer a { color: #a8451f; }
  @media (prefers-color-scheme: dark) { footer { border-color: #423628; color: #b3a488; } footer a { color: #e07a4e; } }
  :root[data-theme="dark"] footer { border-color: #423628; color: #b3a488; }
</style>
</head>
<body>
<div class="page">
  <p class="eyebrow">संस्कृतम् · अनुवादः</p>
  <h1>Перевод с русского</h1>
  <div id="app"></div>
  <footer>
    9 предложений: русский ↔ санскрит. Соедините каждую пару.
    <!-- LearningApps source: https://learningapps.org/display?v=pmadaq8vt25 -->
    Учебный виджет Systema&nbsp;Sanscriticum.
  </footer>
</div>

<script src="/exercises/gate.js" defer></script>
<script src="/exercises/telemetry.js" data-drill="match" data-band="ru-sa-sentences" defer></script>
<script src="../engine.js"></script>
<script>
  MatchExercise.mount(document.getElementById("app"), {
    task: "Найдите пару: соедините русский перевод с санскритским предложением.",
    feedback: "Здорово, ты нашел правильное решение.",
    leftTitle: "Русский",
    rightTitle: "Санскрит",
    shuffle: true,
    pairs: [
      { left: { text: "Этот актер танцует, а тот поет." }, right: { text: "अयं नटः नृत्यति, सः गायति" } }
      { left: { text: "Что падает? Те листья падают." }, right: { text: "कानि पतति। तानि पर्णानि पतन्ति" } }
      { left: { text: "Кто (двое) кричат? Эти два лебедя кричат." }, right: { text: "कौ कूजतः। इमौ हंसौ कूजतः" } }
      { left: { text: "Тот царь садится в колесницу." }, right: { text: "सः नृपतिः रथम् आरोहति" } }
      { left: { text: "Эти девочки делают гирлянды." }, right: { text: "इमाः बालाः मालाः कुर्वन्ति" } }
      { left: { text: "Что ты видишь? Я вижу тот цветок." }, right: { text: "किं पश्यसि। अहं तत् पुष्पं पश्यामि" } }
      { left: { text: "Кто читает? Этот ученик читает." }, right: { text: "कः पठति। अयं छात्रः पठति" } }
      { left: { text: "Этот слон ест фрукт." }, right: { text: "अयं गजः फलं खादति" } }
      { left: { text: "Что расцветает? Тот лотос расцветает." }, right: { text: "किं विकसति। तत् कमलं विकसति" } }
    ]
  });
</script>
</body>
</html>
