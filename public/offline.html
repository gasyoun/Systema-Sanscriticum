<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#E85C24">
  <title>Нет сети — ОРС LMS</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #F4F1EA;
      color: #1A1A1A;
    }
    .card {
      max-width: 22rem;
      width: 100%;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 1.25rem;
      padding: 1.75rem 1.5rem;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0,0,0,.06);
    }
    .mark {
      width: 3.5rem;
      height: 3.5rem;
      margin: 0 auto 1rem;
      border-radius: 1rem;
      background: #fff4ec;
      color: #E85C24;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      font-weight: 800;
    }
    h1 {
      margin: 0 0 .5rem;
      font-size: 1.25rem;
      font-weight: 800;
    }
    p {
      margin: 0 0 1.25rem;
      color: #6b7280;
      font-size: .95rem;
      line-height: 1.45;
    }
    button {
      appearance: none;
      border: 0;
      border-radius: .75rem;
      background: #E85C24;
      color: #fff;
      font-weight: 700;
      font-size: .95rem;
      padding: .75rem 1.25rem;
      cursor: pointer;
      width: 100%;
    }
    button:active { transform: scale(.98); }
    .hint {
      margin-top: .85rem;
      font-size: .75rem;
      color: #9ca3af;
    }
  </style>
</head>
<body>
  <main class="card" role="status" aria-live="polite">
    <div class="mark" aria-hidden="true">!</div>
    <h1>Нет подключения</h1>
    <p>Кабинет ОРС LMS сейчас недоступен без сети. Проверьте интернет и попробуйте снова.</p>
    <button type="button" onclick="location.reload()">Обновить</button>
    <p class="hint">Сохранённые на устройстве материалы не кэшируются этим экраном — только оболочка.</p>
  </main>
</body>
</html>
