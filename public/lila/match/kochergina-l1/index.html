<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Санскрит · Кочергина, урок 1 — слова</title>
<link rel="stylesheet" href="../engine.css">
<style>
  body { margin: 0; background: #f3ecdb; }
  @media (prefers-color-scheme: dark) { body { background: #1c1712; } }
  :root[data-theme="dark"] body { background: #1c1712; }
  :root[data-theme="light"] body { background: #f3ecdb; }
  .page { max-width: 1000px; margin: 0 auto; padding: 28px 20px 60px; }
  .eyebrow {
    font-family: "Noto Sans Devanagari","Nirmala UI",serif;
    font-size: 13px; letter-spacing: .16em; color: #a8451f; font-weight: 600; margin: 0 0 6px;
  }
  @media (prefers-color-scheme: dark) { .eyebrow { color: #e07a4e; } }
  :root[data-theme="dark"] .eyebrow { color: #e07a4e; }
  h1 {
    font-family: "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif; font-weight: 600;
    font-size: clamp(26px, 4.5vw, 40px); margin: 0 0 12px; color: #2a2118; text-wrap: balance;
  }
  @media (prefers-color-scheme: dark) { h1 { color: #efe6d4; } }
  :root[data-theme="dark"] h1 { color: #efe6d4; }
  footer { margin-top: 34px; padding-top: 16px; border-top: 1px solid #d9cba8; font-size: 12.5px; color: #6b5d47; }
  footer a { color: #a8451f; }
  @media (prefers-color-scheme: dark) { footer { border-color: #423628; color: #b3a488; } footer a { color: #e07a4e; } }
  :root[data-theme="dark"] footer { border-color: #423628; color: #b3a488; }
  .sgx-locale-toggle { display: flex; gap: 6px; margin: 0 0 14px; }
  .sgx-locale-btn {
    font: 600 12px/1 "Segoe UI",system-ui,sans-serif; letter-spacing: .06em; padding: 6px 11px;
    border-radius: 999px; border: 1px solid #d9cba8; background: #faf5e8; color: #6b5d47; cursor: pointer;
  }
  .sgx-locale-btn.active { background: #a8451f; border-color: #a8451f; color: #fff; }
  @media (prefers-color-scheme: dark) { .sgx-locale-btn { border-color: #423628; background: #26201a; color: #b3a488; } .sgx-locale-btn.active { background: #e07a4e; border-color: #e07a4e; color: #1c1712; } }
</style>
</head>
<body>
<!--
  Provenance (H1678 A4): 20 pairs taken verbatim from
  database/seeders/data/memrise_6502608/level_02.csv (col_a = IAST word,
  col_b = Russian gloss), the H1431 export of Memrise course 6502608
  "Учебник санскрита" В.А. Кочергиной (own course, samskrtamru).
  level_02 is Kochergina's lesson-1 word list (level_01 in that export is
  a grammar-abbreviation key, not vocabulary — see the README next to the
  CSV). Rows carrying a leading "°" (bound/combining forms, e.g. "°ga")
  were excluded from this A0 pack to keep every pair a free-standing word;
  the 20 rows below are the first 20 free-standing entries in file order.
  Spot-checked all 20 rows against standard Sanskrit dictionaries before
  shipping (logged in the H1678 PR body).
-->
<div class="page">
  <div id="locale-toggle"></div>
  <p class="eyebrow">संस्कृतम् · कोचेर्गिना १</p>
  <h1>Кочергина, урок 1 — слова</h1>
  <div id="app"></div>
  <footer>
    20 слов из первого урока учебника В.А. Кочергиной «Санскрит» (курс Memrise
    6502608, экспорт H1431: <code>database/seeders/data/memrise_6502608/level_02.csv</code>).
    Соедините каждое слово с его переводом. Учебный виджет Systema&nbsp;Sanscriticum.
  </footer>
</div>

<script src="/lila/gate.js" defer></script>
<script src="/lila/telemetry.js" data-drill="match" data-band="kochergina-l1" defer></script>
<script src="/lila/locale.js"></script>
<script src="../engine.js"></script>
<script>
  var I18N = {
    ru: {
      task: "Соедините санскритское слово слева с его русским переводом справа. " +
            "Нажмите карточку, затем её пару — или перетащите одну на другую.",
      feedback: "Задание решено верно. Все слова переведены правильно."
    },
    en: {
      task: "Match each Sanskrit word on the left with its Russian gloss on the right. " +
            "Click a card, then its pair — or drag one onto the other.",
      feedback: "All done — every word is matched correctly."
    }
  };

  SgxLocale.renderToggle(document.getElementById("locale-toggle"));

  MatchExercise.mount(document.getElementById("app"), {
    task: SgxLocale.pick(I18N, "task"),
    feedback: SgxLocale.pick(I18N, "feedback"),
    leftTitle: "Санскрит (IAST)",
    rightTitle: "Перевод",
    pairs: [
      { left: { text: "ka" },     right: { text: "кто, который?" } },
      { left: { text: "kha" },    right: { text: "воздушное пространство, небо" } },
      { left: { text: "ca" },     right: { text: "и" } },
      { left: { text: "ta" },     right: { text: "тот" } },
      { left: { text: "na" },     right: { text: "не" } },
      { left: { text: "bha" },    right: { text: "звезда, созвездие" } },
      { left: { text: "kaṭa" },   right: { text: "циновка" } },
      { left: { text: "dama" },   right: { text: "дом, жилище" } },
      { left: { text: "kaja" },   right: { text: "цветок лотоса" } },
      { left: { text: "dhana" },  right: { text: "богатство, деньги" } },
      { left: { text: "khana" },  right: { text: "яма" } },
      { left: { text: "nakha" },  right: { text: "ноготь" } },
      { left: { text: "gaja" },   right: { text: "слон" } },
      { left: { text: "pada" },   right: { text: "шаг, нога" } },
      { left: { text: "gaṇa" },   right: { text: "множество" } },
      { left: { text: "patha" },  right: { text: "путь" } },
      { left: { text: "gata" },   right: { text: "идущий" } },
      { left: { text: "bhaga" },  right: { text: "счастье" } },
      { left: { text: "jana" },   right: { text: "человек" } },
      { left: { text: "mama" },   right: { text: "мой, меня" } }
    ]
  });
</script>
</body>
</html>
