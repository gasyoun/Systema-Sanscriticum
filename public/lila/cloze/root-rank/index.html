<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Санскрит · Угадайте ранг корня</title>
<link rel="stylesheet" href="../engine.css">
<style>
  body { margin: 0; background: var(--page-bg, #f3ecdb); }
  @media (prefers-color-scheme: dark) { body { background: #1c1712; } }
  :root[data-theme="dark"] body { background: #1c1712; }
  :root[data-theme="light"] body { background: #f3ecdb; }
  .page { max-width: 900px; margin: 0 auto; padding: 28px 20px 60px; }
  .back { display: inline-block; margin: 0 0 14px; font-size: 13px; color: #6b5d47; text-decoration: none; }
  .back:hover { color: #a8451f; }
  @media (prefers-color-scheme: dark) { .back { color: #b3a488; } .back:hover { color: #e07a4e; } }
  :root[data-theme="dark"] .back { color: #b3a488; }
  .eyebrow {
    font-family: "Noto Sans Devanagari","Nirmala UI",serif;
    font-size: 13px; letter-spacing: .16em; color: #a8451f; font-weight: 600; margin: 0 0 6px;
  }
  @media (prefers-color-scheme: dark) { .eyebrow { color: #e07a4e; } }
  :root[data-theme="dark"] .eyebrow { color: #e07a4e; }
  h1 {
    font-family: "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif; font-weight: 600;
    font-size: clamp(26px, 4.5vw, 40px); margin: 0 0 18px; color: #2a2118; text-wrap: balance;
  }
  @media (prefers-color-scheme: dark) { h1 { color: #efe6d4; } }
  :root[data-theme="dark"] h1 { color: #efe6d4; }
  .sgx-locale-toggle { display: flex; gap: 6px; margin: 0 0 14px; }
  .sgx-locale-btn {
    font: 600 12px/1 "Segoe UI",system-ui,sans-serif; letter-spacing: .06em; padding: 6px 11px;
    border-radius: 999px; border: 1px solid #d9cba8; background: #faf5e8; color: #6b5d47; cursor: pointer;
  }
  .sgx-locale-btn.active { background: #a8451f; border-color: #a8451f; color: #fff; }
  @media (prefers-color-scheme: dark) { .sgx-locale-btn { border-color: #423628; background: #26201a; color: #b3a488; } }
  :root[data-theme="dark"] .sgx-locale-btn { border-color: #423628; background: #26201a; color: #b3a488; }
  footer { margin-top: 34px; padding-top: 16px; border-top: 1px solid #d9cba8; font-size: 12.5px; color: #6b5d47; }
  footer a { color: #a8451f; }
  @media (prefers-color-scheme: dark) { footer { border-color: #423628; color: #b3a488; } footer a { color: #e07a4e; } }
  :root[data-theme="dark"] footer { border-color: #423628; color: #b3a488; }
</style>
</head>
<body>
<div class="page">
  <a class="back" href="../">← Все упражнения с пропусками</a>
  <div id="locale-toggle"></div>
  <p class="eyebrow">संस्कृतम् · धातवः · आवृत्तिक्रमः</p>
  <h1 id="pg-h1">Угадайте ранг корня</h1>
  <div id="app"></div>
  <footer id="pg-footer">
    Для каждого из 25 самых частых глагольных корней (Digital Corpus of Sanskrit, Oliver
    Hellwig, CC BY&nbsp;4.0) выберите диапазон его ранга по частотности. Данные — те же, что и
    в упражнении «Корни: топ-25».
  </footer>
</div>

<script src="/lila/gate.js" defer></script>
<script src="/lila/telemetry.js" data-drill="cloze" data-band="root-rank" defer></script>
<script src="/lila/locale.js"></script>
<script src="../../roots/data.js"></script>
<script src="../engine.js"></script>
<script>
  var I18N = {
    ru: {
      h1: "Угадайте ранг корня",
      footer: "Для каждого из 25 самых частых глагольных корней (Digital Corpus of Sanskrit, Oliver " +
              "Hellwig, CC BY 4.0) выберите диапазон его ранга по частотности. Данные — те же, что и " +
              "в упражнении «Корни: топ-25».",
      task: "Для каждого корня выберите диапазон его ранга по частоте в корпусе, затем нажмите «Проверить».",
      feedback: "Отлично, все 25 рангов угаданы верно!"
    },
    en: {
      h1: "Guess the root's frequency rank",
      footer: "For each of the 25 most frequent Sanskrit verbal roots (Digital Corpus of Sanskrit, " +
              "Oliver Hellwig, CC BY 4.0), pick its frequency-rank band. Same data as the " +
              "“Roots: top-25” exercise.",
      task: "For each root, pick its frequency-rank band, then press “Check”.",
      feedback: "Well done, all 25 ranks guessed correctly!"
    }
  };

  document.getElementById("pg-h1").textContent = SgxLocale.pick(I18N, "h1");
  document.getElementById("pg-footer").textContent = SgxLocale.pick(I18N, "footer");
  SgxLocale.renderToggle(document.getElementById("locale-toggle"));

  // Cumulative bands are the same order as the rank list, so rank -> band
  // is a plain arithmetic bucket -- no need to hand-author 25 blanks.
  var BAND_SIZE = 5;
  var roots = ROOT_BANDS.top25.slice().sort(function (a, b) { return a.rank - b.rank; });
  var bandLabels = [];
  for (var i = 1; i <= roots.length; i += BAND_SIZE) {
    bandLabels.push((i) + "–" + Math.min(i + BAND_SIZE - 1, roots.length));
  }

  var segments = [];
  roots.forEach(function (row, idx) {
    var bandIndex = Math.floor(idx / BAND_SIZE);
    segments.push(row.devanagari + " (" + row.iast + ") — " + row.gloss_ru + ": ");
    segments.push({ options: bandLabels.slice(), answer: bandLabels[bandIndex] });
    segments.push("\n");
  });

  ClozeExercise.mount(document.getElementById("app"), {
    task: SgxLocale.pick(I18N, "task"),
    feedback: SgxLocale.pick(I18N, "feedback"),
    shuffle: false,
    segments: segments
  });
</script>
</body>
</html>
