<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Санскрит · Варнамала (пилот)</title>
<link rel="stylesheet" href="../engine.css">
<style>
  body { margin: 0; background: var(--vm-pg, #f3ecdb); color: var(--vm-ink, #2a2118); }
  .page { max-width: 960px; margin: 0 auto; padding: 28px 20px 70px; }
  .eyebrow {
    font-family: "Noto Sans Devanagari","Nirmala UI",serif;
    font-size: 13px; letter-spacing: .16em; color: var(--vm-accent, #a8451f); font-weight: 600; margin: 0 0 6px;
  }
  h1 {
    font-family: "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif; font-weight: 600;
    font-size: clamp(26px, 4.5vw, 40px); margin: 0 0 10px; text-wrap: balance;
  }
  .lead { color: var(--vm-soft, #6b5d47); margin: 0 0 8px; max-width: 58ch; font-size: 15px; }
  footer {
    margin-top: 34px; padding-top: 16px; border-top: 1px solid var(--vm-line, #d9cba8);
    font-size: 12.5px; color: var(--vm-soft, #6b5d47);
  }
  footer a { color: var(--vm-accent, #a8451f); }
  .sgx-locale-toggle { display: flex; gap: 6px; margin: 0 0 14px; }
  .sgx-locale-btn {
    font: 600 12px/1 "Segoe UI",system-ui,sans-serif; letter-spacing: .06em; padding: 6px 11px;
    border-radius: 999px; border: 1px solid var(--vm-line, #d9cba8); background: var(--vm-pnl, #faf5e8);
    color: var(--vm-soft, #6b5d47); cursor: pointer;
  }
  .sgx-locale-btn.active {
    background: var(--vm-accent, #a8451f); border-color: var(--vm-accent, #a8451f); color: #fff;
  }
</style>
</head>
<body>
<!--
  H2436 Varnamālā pilot — Metamorphabet-inspired Devanāgarī toy.
  CSS morph proxy; Rive art lands later under ../rive/ without schema change.
  Brief: docs/VARNAMALA_PILOT_BRIEF_2026.md
-->
<div class="page">
  <div id="locale-toggle"></div>
  <p class="eyebrow">संस्कृतम् · वर्णमाला</p>
  <h1 data-i18n-ru="Живые акшары" data-i18n-en="Living akṣaras">Живые акшары</h1>
  <p class="lead" data-i18n-ru="Пилот: 10 букв. Трогай — буква меняется и становится словом. Не экзамен: игрушка для глаза и уха."
     data-i18n-en="Pilot: 10 letters. Tap — the glyph morphs into a word. A toy for eye and ear, not a test.">
    Пилот: 10 букв. Трогай — буква меняется и становится словом. Не экзамен: игрушка для глаза и уха.
  </p>
  <div id="app"></div>
  <footer>
    H2436 · CSS-прокси до Rive ·
    <a href="../">семейство варны</a> ·
    <a href="/lila/">все лилы</a>
  </footer>
</div>

<script src="/lila/gate.js" defer></script>
<script src="/lila/telemetry.js" data-drill="varnamala" data-band="pilot" defer></script>
<script src="/lila/locale.js"></script>
<script src="../data.js"></script>
<script src="../engine.js"></script>
<script>
  var api = null;
  function applyLocaleTitles() {
    var loc = (window.SgxLocale && SgxLocale.get && SgxLocale.get()) || "ru";
    document.querySelectorAll("[data-i18n-ru]").forEach(function (n) {
      n.textContent = loc === "en" ? n.getAttribute("data-i18n-en") : n.getAttribute("data-i18n-ru");
    });
    if (api && api.setLocale) api.setLocale(loc);
  }

  if (window.SgxLocale && SgxLocale.renderToggle) {
    SgxLocale.renderToggle(document.getElementById("locale-toggle"));
  }

  var loc0 = (window.SgxLocale && SgxLocale.get && SgxLocale.get()) || "ru";
  api = VarnamalaPilot.mount(document.getElementById("app"), { locale: loc0 });
  applyLocaleTitles();

  document.getElementById("locale-toggle").addEventListener("click", function () {
    setTimeout(applyLocaleTitles, 0);
  });
</script>
</body>
</html>
