# MANAGED FILE — scripts/server_guards_apply.sh --profile n8n.
# Wave 4c (H3184): паритет .91 с .92. На .92 этот файл лежит с 29.07.2026,
# на .91 каталог /etc/ssh/sshd_config.d/ до сих пор ПУСТ, а sshd -T отвечает
# passwordauthentication yes — то есть подбор пароля по 22 порту открыт.
#
# Формулировки совпадают с .92 намеренно: две продовые машины с разными
# правилами входа — это две разные поверхности атаки, которые надо помнить
# по отдельности.
#
# ПОРЯДОК В ОКНЕ: этот файл кладётся ПОСЛЕ того, как default-deny (W4a) уже
# подтверждён новой SSH-сессией. Ключевой вход и так работает (pubkey yes),
# поэтому сам по себе файл не может отрезать доступ — но проверять его надо
# всё равно новой сессией, а не текущей.
#
# Аварийный доступ, если ключевой вход всё же сломается: Tailscale
# (100.80.27.28, узел vps-n8n) и только потом консоль Proxmox через Артёма.

PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin prohibit-password
