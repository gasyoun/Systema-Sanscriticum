# MANAGED FILE — scripts/server_guards_apply.sh --profile n8n.
# Wave 4c (H3184): паритет .91 с .92. На .91 fail2ban сейчас inactive.
#
# banaction = nftables — согласовано с W4a: fail2ban заводит СВОЮ таблицу
# f2b-table рядом с table inet filter. Наш ruleset её не трогает и не флашит,
# поэтому бан переживает перезагрузку правил, а перезагрузка правил не снимает
# баны.
#
# backend = systemd, потому что на .91 sshd пишет в журнал, а не в /var/log/auth.log.

[DEFAULT]
banaction = nftables
banaction_allports = nftables[type=allports]

[sshd]
backend = systemd
journalmatch = _SYSTEMD_UNIT=ssh.service + _COMM=sshd
enabled = true
