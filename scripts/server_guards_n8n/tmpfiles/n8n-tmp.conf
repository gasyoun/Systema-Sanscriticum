# MANAGED FILE — ставится scripts/server_guards_apply.sh --profile n8n из
# scripts/server_guards_n8n/tmpfiles/n8n-tmp.conf.
#
# Тип d с возрастом: чистить СОДЕРЖИМОЕ /tmp старше @@TMP_AGE_DAYS@@ суток.
# Дистрибутивный /usr/lib/tmpfiles.d/tmp.conf задаёт /tmp без возраста; при
# одинаковом пути systemd-tmpfiles берёт файл, чьё ИМЯ идёт раньше по алфавиту,
# и «n8n-tmp.conf» < «tmp.conf» — то есть выигрывает эта строка.
#
# ЧЕСТНО О ТОМ, ЧТО ЭТО ДАЁТ. При 10 сутках правило ПОВЕДЕНИЯ не меняет:
# стоковый Debian несёт ровно такое же (`q /tmp 1777 root root 10d`), и
# systemd-tmpfiles-clean.timer исправно ходит раз в сутки. Файл всё же нужен
# ради трёх вещей: число переезжает в server_guards_n8n.conf (одно место для
# чисел), обновление дистрибутива больше не может его молча сменить, и манифест
# замечает пропажу правила.
#
# Чтобы правило стало НАСТОЯЩИМ предохранителем, число надо СНИЗИТЬ: 3 суток
# поймали бы /tmp/hindi_audio (7.3 ГиБ, не тронут с 15-08) неделей раньше, чем
# это сделал человек. Это решение человека, а не агента — оно про автоматическое
# удаление чужих файлов. Тот же незакрытый вопрос, что и на .92.
#
# Проверять после установки: systemd-tmpfiles --clean --dry-run 2>&1 | grep /tmp
d /tmp @@TMP_TMPFS_MODE@@ root root @@TMP_AGE_DAYS@@d
