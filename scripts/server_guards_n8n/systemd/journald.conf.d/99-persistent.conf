# MANAGED FILE — scripts/server_guards_apply.sh --profile n8n.
# .91, 25-08-2026: журнал занимал 1.5 ГиБ и НЕ имел ни одного drop-in'а —
# то есть ни потолка, ни гарантии, что он переживёт перезагрузку.
# Разбор зависания .92 29-07 оказался возможен только потому, что журнал там
# случайно был persistent; здесь это делается явно, а не по случайности.
[Journal]
Storage=persistent
Compress=yes
SystemMaxUse=@@JOURNAL_MAX_USE@@
SystemKeepFree=@@JOURNAL_KEEP_FREE@@
SystemMaxFileSize=@@JOURNAL_MAX_FILE_SIZE@@
MaxRetentionSec=@@JOURNAL_RETENTION@@
# Не душить: во время аварии интересны ровно повторяющиеся строки, которые
# rate limiting и выбросил бы.
RateLimitIntervalSec=0
RateLimitBurst=0
