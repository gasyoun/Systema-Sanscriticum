# MANAGED FILE — ставится scripts/server_guards_apply.sh из
# scripts/server_guards/tmpfiles/systema-tmp.conf.
#
# Тип d с возрастом: чистить СОДЕРЖИМОЕ /tmp старше @@TMP_AGE_DAYS@@ суток.
# Дистрибутивный /usr/lib/tmpfiles.d/tmp.conf задаёт /tmp без возраста; при
# одинаковом пути systemd-tmpfiles берёт файл, чьё ИМЯ идёт раньше по алфавиту,
# и «systema-tmp.conf» < «tmp.conf» — то есть выигрывает эта строка. Проверять
# после установки: systemd-tmpfiles --clean --dry-run 2>&1 | grep /tmp
d /tmp @@TMP_TMPFS_MODE@@ root root @@TMP_AGE_DAYS@@d
