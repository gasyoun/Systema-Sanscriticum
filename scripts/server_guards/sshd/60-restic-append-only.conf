# Append-only restic push path — MG ruling 13-09-2026.
#
# Why: the repo password (/root/.restic-pass) and the SFTP push key both live on
# the .92 pusher. Before this, a root compromise of .92 could run
# `restic forget --prune` through the SFTP account and wipe the whole snapshot
# history on .91 — the "hourly backup" would then be worth only the daily Drive
# fanout. With `-P remove,rmdir` the push path can create and rename but never
# delete, so snapshot history survives a full .92 compromise.
#
# Denied requests: remove,rmdir. Everything restic needs for a backup stays
# allowed (mkdir, create, write, rename — restic saves via tmp file + rename).
# Retention (forget --prune) therefore runs on the .91 side as the restic-push
# user (ops/backup/systema-restic-forget.sh + restic-forget.timer).
#
# Standing canary: /srv/restic/systema/PROBE_APPEND_ONLY_*.txt cannot be removed
# over this path — a quick live proof is
#   printf 'rm /systema/PROBE_APPEND_ONLY_13-09-2026.txt\n' | sftp -b - \
#     -i /root/.ssh/id_restic_push restic-push@192.168.200.91
# and must answer "Permission denied".
#
# Note: restic clients on .92 run with --no-lock (backup + size-sanity): a
# lockless writer cannot create the lock files it is then unable to delete.
Match User restic-push
    ChrootDirectory /srv/restic
    ForceCommand internal-sftp -P remove,rmdir
    X11Forwarding no
    AllowTcpForwarding no
    AllowAgentForwarding no
    PermitTunnel no
