; MANAGED FILE — scripts/server_guards_apply.sh. Значение — из scripts/server_guards.conf.
; Авария 28.07.2026: memory_limit = -1 в CLI позволял одному artisan-процессу
; съесть весь контейнер (лимит LXC 8 ГиБ). 768M хватает всем штатным командам
; (воркеры Horizon и MadelineProto живут на ~100 МБ). Composer поднимает себе
; лимит сам (COMPOSER_MEMORY_LIMIT), ему эта настройка не мешает.
memory_limit = @@PHP_CLI_MEMORY_LIMIT@@
