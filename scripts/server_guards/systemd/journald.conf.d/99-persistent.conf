# MANAGED FILE — scripts/server_guards_apply.sh.
# Systema: keep a full, durable journal across reboots (MG, 29-07-2026).
# The 29-07 hang was diagnosable only because journald happened to be persistent;
# make that explicit rather than incidental, and give it room.
[Journal]
Storage=persistent
Compress=yes
SystemMaxUse=@@JOURNAL_MAX_USE@@
SystemKeepFree=@@JOURNAL_KEEP_FREE@@
SystemMaxFileSize=@@JOURNAL_MAX_FILE_SIZE@@
MaxRetentionSec=@@JOURNAL_RETENTION@@
# Do not throttle: during an incident the interesting lines are exactly the
# repeated ones that rate limiting would drop.
RateLimitIntervalSec=0
RateLimitBurst=0
# Forward to rsyslog so /var/log/syslog is populated too.
ForwardToSyslog=yes
