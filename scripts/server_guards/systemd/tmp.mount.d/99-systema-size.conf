# MANAGED FILE — ставится scripts/server_guards_apply.sh из
# scripts/server_guards/systemd/tmp.mount.d/99-systema-size.conf.
# Править надо копию в репозитории: guards:verify назовёт любую правку руками
# расхождением.
#
# Стоковый tmp.mount просит size=50%. Внутри LXC эти проценты ядро считает от
# памяти ХОСТА, а не контейнера: 126 ГиБ потолка при 16 ГиБ у гостя — то есть
# потолка нет вовсе. nr_inodes=1m сохраняем из стокового юнита: Options
# перекрывается целиком, и молча потерять готовый предохранитель, устанавливая
# новый, — худший способ его установить.
[Mount]
Options=mode=@@TMP_TMPFS_MODE@@,strictatime,nosuid,nodev,size=@@TMP_TMPFS_SIZE@@,nr_inodes=1m
