# MANAGED FILE — scripts/server_guards_apply.sh.
#
# Systema, 29-07-2026 — complements cron.service.d/memory-cap.conf, does NOT
# duplicate it. The memory NUMBERS live in that file (MemoryHigh/MemoryMax) and
# are deliberately not repeated here: two drop-ins setting the same directive
# means the effective value is whichever file sorts last, which is a trap.
#
# What this file adds, and why:
[Unit]
# Repeated OOM restarts must never trip the start-limit and leave cron dead —
# a dead cron is a silently dead scheduler (no reminders, no payments sweep).
StartLimitIntervalSec=0

[Service]
# A process-count ceiling. pids.max on this container is unlimited, so nothing
# bounded the pile-up by COUNT even once memory was capped.
TasksMax=@@CRON_TASKS_MAX@@
# The direct fix for the observed 28-07 failure mode: the kernel OOM killer took
# out cron ALONE, and systemd then restarted the unit on top of ~20 orphaned php
# processes ("cron.service: Found left-over process 114146 (php) in control
# group"). OOMPolicy=kill tears down the whole cgroup instead, so cron always
# restarts clean with no orphans.
OOMPolicy=kill
Restart=always
RestartSec=5s
