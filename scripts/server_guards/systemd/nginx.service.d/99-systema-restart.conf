# MANAGED FILE — ставится scripts/server_guards_apply.sh из
# scripts/server_guards/systemd/nginx.service.d/99-systema-restart.conf.
#
# 19-08-2026: `systemctl show -p Restart nginx` отдавал `no`. Всё остальное
# критичное на этой машине перезапускается (redis-server, tg-tunnel, tg-reverse,
# earlyoom — always; php8.3-fpm, mariadb, supervisor, samudra, kosha —
# on-failure/on-abnormal), а единственный процесс, который отдаёт сайт,
# оставался лежать.
#
# on-failure, а НЕ always: осознанный `systemctl stop nginx` на время работ
# обязан оставить сайт погашенным, иначе оператор теряет возможность его
# погасить. Ловушка из server_guards.conf в силе: два drop-in'а с одной
# директивой разрешает сортировка имён, а не замысел — префикс 99- и один файл
# на одну заботу.
[Service]
Restart=on-failure
RestartSec=5s
