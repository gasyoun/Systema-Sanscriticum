# MANAGED FILE — scripts/server_guards_apply.sh (профиль app).
# H3664 (29-08-2026): ЕДИНСТВЕННАЯ задача этого файла — ignoreip.
#
# Здесь НЕТ enabled / banaction / backend и нет секции [sshd] — это намеренно.
# .92 — Tier-0 (студенты, деньги), и её fail2ban до сих пор жил на defaults-debian.conf.
# Менять заодно поведение бана в том же проходе значило бы везти два изменения под
# одним решением; паритет по banaction — отдельный разговор (см. W4b).
#

[DEFAULT]
# ignoreip — НЕ удобство, а третий предохранитель волны 4 (H3664, MG 29-08-2026).
# Обе машины — LXC-гости БЕЗ консоли. Аллоу-лист default-deny специально держит
# открытыми ровно два пути восстановления: приватную сеть Proxmox 192.168.200.0/24
# и Tailscale (CGNAT-диапазон 100.64.0.0/10). Бан fail2ban по этим адресам снял бы
# именно те пути, ради которых аллоу-лист написан — то есть оба сразу, при идеально
# выглядящем ruleset'е. Артём (консоль Proxmox) в отпуске примерно до 19-09-2026.
# Публичный 22 порт это НЕ ослабляет: из интернета подбор банится как раньше.
ignoreip = 127.0.0.1/8 ::1 192.168.200.0/24 100.64.0.0/10
