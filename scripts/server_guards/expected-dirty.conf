# MANAGED FILE — expected-dirty baseline для systema-git-integrity.sh (H4590).
# Устанавливается scripts/server_guards_apply.sh в
# /usr/local/share/systema-guards/expected-dirty.conf. Править копию в
# репозитории (scripts/server_guards/expected-dirty.conf), не на сервере:
# расхождение видно guards:verify.
#
# Формат: ОДНА regex-строка (ERE, как в bash [[ =~ ]]) на каждый «законно
# грязный» UNTRACKED-путь целиком от корня /var/www/html.
# «#» в начале строки — комментарий. Всё, что не совпало ни с одной строкой —
# tamper suspect: уводит guard в FAIL (exit 2) и пишет в Hermes-дайджест.
#
# ЗАЧЕМ. Урок samskrtam95 (H4570): импланты жили в незакоммиченных файлах
# докорня, и никто не отличал «наш рабочий мусор» от «чужой файл» ДО взлома.
# Этот список — договор о том, какой грязью дерево имеет право быть грязным.
# Tracked-изменения (модификация/удаление/стейдж существующих файлов) этим
# списком НЕ оправдываются никогда — они suspect всегда.
#
# Базис снят с живого .92 11-09-2026, 57 записей porcelain, 0 tracked-dirty.

# .env и все его бэкап-варианты (.env.bak-*, .env.bak.*, .env.h*.bak, …) —
# рутина каждого хендоффа, трогающего секреты. Файлов ~48.
^\.env($|\.)

# Runtime-состояние приложения (локи сторожей, кеши, логи, спаты-дампы).
^storage/

# Локальный лог демона MadelineProto в корне дерева.
^MadelineProto\.log$

# Известные артефакты-«джанк» в корне (следы шелл-редиректов былых сессий;
# свипнуть их или нет — решение человека, guard на них НЕ ругается):
^\[\^,\]$
^id$
^nul$
^value$

# Известные некоммиченные рабочие файлы:
^config/marathon_landing_copy\.php\.bak_tm_20260801$
^docs/rukovodstvo-studenta\.pdf$
^public/gift/accountant-guide\.html$
