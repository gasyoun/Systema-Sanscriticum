#
# server_guards.conf — единственное место, где живут ЧИСЛА предохранителей прода.
#
# Читается двумя потребителями и только ими:
#   • scripts/server_guards_apply.sh  — подставляет значения в шаблоны и применяет
#   • php artisan guards:verify       — сверяет живую машину с этими значениями
#
# Формат сознательно беден: KEY=value, одна пара на строку, значение можно
# обернуть в двойные кавычки, «#» начинает комментарий только в начале строки.
# Никаких $-подстановок, никаких обратных кавычек, никаких многострочных
# значений — иначе PHP-парсер и bash разошлись бы в понимании одного файла.
#
# Разбор аварий 23–24.07 и 28–29.07.2026 — docs/server-resource-guards.md.
# Значения ниже сняты с живого прода 30-07-2026 (H1914).
#

# ── Приложение ───────────────────────────────────────────────────────────────
APP_DIR=/var/www/html
APP_USER=www-data
PHP_VERSION=8.3
PHP_BIN=/usr/bin/php

# ── Планировщик (обёртка вместо голого schedule:run) ─────────────────────────
# Потолок выше самой долгой штатной команды (telegram-harvest:roster-groups, 600 с).
SCHEDULE_MAX_SECONDS=900

# ── Сторожевые строки cron: своя судьба, свой замок, свой таймаут ────────────
WATCHDOG_CABINET_SCHEDULE="*/15 * * * *"
WATCHDOG_CABINET_MAX_SECONDS=120
WATCHDOG_HEARTBEAT_SCHEDULE="*/5 * * * *"
WATCHDOG_HEARTBEAT_MAX_SECONDS=60

# ── Потолки памяти. ЧИСЛА ЖИВУТ ТОЛЬКО ЗДЕСЬ ────────────────────────────────
# Ловушка, на которую наступили 29-07: два drop-in-файла, задающих MemoryMax,
# дают эффективное значение по порядку сортировки имён, а не по замыслу. Поэтому
# числа памяти для юнита пишет РОВНО ОДИН файл (memory-cap.conf), а
# 99-systema-limits.conf добавляет только то, чего в нём нет. guards:verify
# проверяет это отдельной проверкой (single-definition).
CRON_MEMORY_HIGH=2G
CRON_MEMORY_MAX=3G
# Гейт предупреждения cgroup (25-08-2026). Замер .92: «память» группы почти
# целиком page cache от GB-scale IO кронских детей (anon 63 МиБ, file 1.5 ГиБ),
# и мгновенный порог ≥80 % от high флапал вокруг деплоев — красный блок в
# каждом деплое и повторные Telegram. Warning теперь требует, чтобы ядро САМО
# подтвердило давление: memory.pressure (PSI) some avg10 ≥ этого процента.
# Critical (current ≥ high) не гейтуется. Файл PSI не читается — старое
# поведение без гейта; число НЕ трогать молча: это чувствительность тревоги,
# а не шум. Поднять можно только с разбором в docs/server-resource-guards.md.
CGROUP_PSI_SOME_PCT=1.0
CRON_TASKS_MAX=200
SUPERVISOR_MEMORY_HIGH=3G
SUPERVISOR_MEMORY_MAX=4G
LIMIT_NOFILE=65535

# ── Демон MadelineProto: свой юнит, свой бюджет (H3121, 19-08-2026) ─────────
# Раньше демон жил в cgroup того, кто его первым попросил — то есть под кроном,
# за счёт CRON_MEMORY_HIGH. Разросшись, он тормозил ВСЮ группу: авто-деплой,
# планировщик, оба сторожа. Теперь его поднимает systema-madeline-daemon.service,
# и эти числа — его собственный потолок. Здоровый демон ~106 МиБ.
MADELINE_MEMORY_HIGH=768M
MADELINE_MEMORY_MAX=1G
MADELINE_TASKS_MAX=64
# Потолки, по которым надзор (telegram-support:daemon) сам гасит демона, не
# дожидаясь ядра. Безопасны ровно потому, что демон теперь свой: его перезапуск
# не задевает ни cron, ни supervisor.
MADELINE_DAEMON_MAX_RSS_MB=700
# Течь ~1 дескриптор на подключение клиента (vendor-дефект MadelineProto, чинить
# в vendor нельзя) — при крон-минутке это ~1440 в сутки. 2000 ≈ полтора дня.
MADELINE_DAEMON_MAX_FDS=2000
MADELINE_DAEMON_MAX_AGE_HOURS=12
MADELINE_DAEMON_CHECK_SECONDS=60
# Возраст отметки systema-schedule-run.sh, после которого планировщик считается
# мёртвым. 15 минут — четверть часа тишины при штатном такте раз в минуту;
# 19-08-2026 тишина длилась семь часов и никто её не заметил.
SCHEDULER_STAMP_MAX_MINUTES=15

# ── Докатка Yandex-частей: свой юнит, свой бюджет (H3410, 25-08-2026) ────────
# Та же болезнь, что у демона (§9 docs/server-resource-guards.md): команда
# раньше жила в Kernel.php под cron.service, а 24-08-2026 SOS-разбор нашёл
# PUT, застрявший в TLS sendto() EAGAIN без прогресса 30+ минут. Теперь её
# поднимает systema-yandex-resume.service/.timer, и эти числа — её
# собственный потолок, отдельный от CRON_MEMORY_HIGH. Одна часть ≤20 МиБ в
# памяти плюс php-fpm-подобный рабочий набор — щедрый запас, не тесная посадка.
YANDEX_RESUME_MEMORY_HIGH=512M
YANDEX_RESUME_MEMORY_MAX=768M
YANDEX_RESUME_TASKS_MAX=32
# Потолок ОДНОГО прогона. Несколько частей по 300 с (CURLOPT_TIMEOUT в
# AppServiceProvider) каждая — 20 минут оставляет запас на десяток зависших
# частей подряд, что уже само по себе означало бы отдельную аварию на
# стороне Яндекса, а не докатки.
YANDEX_RESUME_TIMEOUT_SECONDS=1200

# ── PHP ─────────────────────────────────────────────────────────────────────
# Было -1: один artisan-процесс мог съесть весь контейнер. Штатный рабочий
# набор этих процессов ~100 МБ.
PHP_CLI_MEMORY_LIMIT=768M
FPM_MAX_CHILDREN=12
FPM_MAX_REQUESTS=500

# ── earlyoom: убить раньше, чем ядро уйдёт в livelock ───────────────────────
EARLYOOM_REPORT_INTERVAL=60
EARLYOOM_TERM_PERCENT=10
EARLYOOM_KILL_PERCENT=5
EARLYOOM_AVOID_RE="^(systemd|mariadbd|nginx|sshd|redis-server|supervisord|init|systemd-journal)$"
EARLYOOM_PREFER_RE="^php[0-9.]*$"

# ── Наблюдаемость ───────────────────────────────────────────────────────────
MEMWATCH_THRESHOLD_PCT=25
JOURNAL_MAX_USE=3G
JOURNAL_KEEP_FREE=2G
JOURNAL_MAX_FILE_SIZE=128M
JOURNAL_RETENTION=180day
SYSSTAT_HISTORY_DAYS=31
LOGROTATE_KEEP_DAYS=21
LOGROTATE_MAX_SIZE=50M

# ── Авто-деплой (H1933) ─────────────────────────────────────────────────────
# Каждые 30 минут root-cron сверяет HEAD с origin/main и, если отстал, зовет
# deploy.sh через обёртку systema-auto-deploy-run.sh. Любой провал деплоя или
# пост-деплойной проверки здоровья ставит предохранитель
# storage/auto_deploy.disabled — авто-деплой останавливается до разбора
# человеком (файл удалить руками), guards:verify кричит critical.
AUTO_DEPLOY_SCHEDULE="*/30 * * * *"
# Потолок одного прогона: npm build + composer на этом железе ~5–10 мин; 25 мин
# оставляет запас и гарантированно освобождает замок до следующего слота.
AUTO_DEPLOY_MAX_SECONDS=1500
# Минимум MemAvailable после деплоя — ниже значит деплой раздул память
# (класс аварий 23-07/28-07-2026).
AUTO_DEPLOY_MIN_AVAILABLE_MB=1024
AUTO_DEPLOY_SMOKE_URL=https://samskrte.ru/
# H2149 — само-перепроверка МЯГКОГО предохранителя ([blocked-preflight],
# [blocked-dirty], [timeout-alive], [rolled-back]). Жёсткого (без метки) не
# касается: тот ждёт человека, как и ждал.
# Пауза перед повтором, минут. 30 = следующий слот крона: раньше смысла нет,
# позже — прод стоит дольше, чем нужно.
AUTO_DEPLOY_RETRY_AFTER_MINUTES=30
# Сколько само-снятий подряд разрешено, прежде чем условие признаётся
# неизлечимым и отдаётся человеку. 3 ≈ полтора часа попыток: лечится само —
# уложится, не лечится — перестанем крутиться и скажем об этом прямо.
# Обнуляется ТОЛЬКО успешным деплоем.
AUTO_DEPLOY_MAX_AUTO_RETRIES=3

# ── Юниты, которые обязаны быть active ──────────────────────────────────────
# Через запятую. Пропажа любого из них — тревога, а не наблюдение.
REQUIRED_ACTIVE_UNITS="cron,supervisor,rsyslog,earlyoom,systema-madeline-daemon"
REQUIRED_ACTIVE_TIMERS="memwatch.timer,sysstat-collect.timer,systema-yandex-resume.timer"

# ── /tmp как tmpfs: потолок и старение (H-1 / H3181, 19-08-2026) ────────────
# /tmp смонтирован tmpfs размером в ПОЛОВИНУ ПАМЯТИ ХОСТА (126 ГиБ), а не
# контейнера: стоковый tmp.mount просит size=50%, и внутри LXC эти проценты
# считаются от 252 ГиБ хоста. Любая запись в /tmp — это заявка на RAM без
# потолка, и заметить её нечем: earlyoom видит процессы, а не файлы.
# Замер 19-08-2026: /tmp/hindi_reasr 7.6 ГиБ (не трогали с 18-08) плюс
# /tmp/whisvenv 452 МиБ держали своп на 5618/8192 МиБ.
# 4G выбраны как «вдвое больше самого большого законного скретча, который мы
# видели» (test45mb.bin, dg92_* — десятки МиБ). Упрётся законный конвейер —
# ПОДНЯТЬ значение здесь и применить заново, но не снимать потолок (риск R1).
TMP_TMPFS_SIZE=4G
TMP_TMPFS_MODE=1777
# 10 суток — заведомо дольше любого живого прогона ASR-конвейера и заведомо
# короче «забыли навсегда».
#
# ЧЕСТНО О ТОМ, ЧТО ЭТО СЕГОДНЯ ДАЁТ (замер .92 19-08-2026). Стоковый Debian
# УЖЕ несёт ровно такое правило — `q /tmp 1777 root root 10d` в
# /usr/lib/tmpfiles.d/tmp.conf строка 11, — и systemd-tmpfiles-clean.timer
# исправно ходит раз в сутки. То есть при 10 сутках наш файл ПОВЕДЕНИЯ НЕ
# МЕНЯЕТ: он дублирует стоковое правило (и выигрывает у него лишь потому, что
# «systema-tmp.conf» < «tmp.conf» по алфавиту).
#
# Посылка из IMPLEMENTATION §1.3 «стоковый tmpfiles их не вычистил» оказалась
# неверна: он их не вычистил потому, что они были МОЛОЖЕ 10 суток
# (hindi_reasr — 1 сутки, whisvenv — 5).
#
# Файл всё же оставлен, и вот ради чего: число переезжает в server_guards.conf
# (одно место для чисел), обновление дистрибутива больше не может его молча
# сменить, а манифест замечает пропажу правила. Это скромно, но это правда —
# в отличие от «мы поставили старение», которого мы не ставили.
#
# ЧТОБЫ ПРАВИЛО СТАЛО НАСТОЯЩИМ ПРЕДОХРАНИТЕЛЕМ, число надо СНИЗИТЬ (3 суток
# поймали бы whisvenv). Это решение человека, а не агента: оно про
# автоматическое удаление чужих файлов на Tier-0 машине, а решение D10 числа
# не называло. Пока потолка размера нет (P5, сторона хоста), агрессивное
# старение — единственный рычаг, который у нас вообще есть.
TMP_AGE_DAYS=10

# ── Провалившиеся юниты (H-2 / H3181) ───────────────────────────────────────
# guards:verify не смотрел на `systemctl --failed`, и samudra-health-monitor
# падал каждые 15 минут с 14-08 по 19-08, никому об этом не сказав: монитор,
# который не может записать собственный лог, — не монитор.
# Юниты, чей провал уже разобран и осознанно терпится, перечислять здесь через
# запятую. Пустой список — норма; глушить проверку удалением её самой нельзя.
FAILED_UNITS_ALLOWLIST=""

# ── Waiver: осознанно терпимые находки (2026-08-25) ─────────────────────────
# Имена guard'ов (guards:verify / cabinet:probe), чьи находки до даты
# GUARD_WAIVERS_EXPIRES понижаются до info: печатаются с «ℹ», но не роняют
# verify, не будят Telegram и не дают деплою exit 75.
# Смысл не в том, чтобы глушить проверку, а в том, чтобы находка, которую
# ФИЗИЧЕСКИ НЕВОЗМОЖНО починить изнутри гостя, не превращала канал в «мальчика
# и волка». Сегодня такой ровно один: tmpfs-cap — /tmp смонтирован на хосте
# Proxmox (в опциях чужой uid=), потолок ставит только Артём (P5 плана
# PLAN_SYSTEMA_SERVER_UPTIME_GUARDRAILS_2026H2.md), scripts/server_guards_apply.sh
# здесь бессилен по устройству LXC.
# Правила безопасности механизма:
#   • fail-closed: EXPIRES отсутствует / не дата YYYY-MM-DD / истекла — waiver
#     НЕ действует, находка остаётся критичной;
#   • misconfig виден: GUARD_WAIVERS задан, а EXPIRES сломан — отдельный warning;
#   • имя без находки («снова здоров» или опечатка) даёт info «убери» — конфиг
#     не гниёт молча. После фикса хоста эту секцию СНЯТЬ.
GUARD_WAIVERS="tmpfs-cap"
GUARD_WAIVERS_EXPIRES="2026-09-30"

# ── Свежесть резервных копий (H-3 / H3181) ──────────────────────────────────
# Порог возраста новейшего архива, суток. Совпадает с monitor_backups в
# config/backup.php: у двух правд разошлись бы пороги, а не только числа.
BACKUP_MAX_AGE_DAYS=8
# 1 = отсутствие живого off-site назначения критично. Локальная копия делит
# судьбу с контейнером, который она защищает.
BACKUP_REQUIRE_OFFSITE=1
# Диски из config/backup.php destination.disks, которые считаются off-site.
BACKUP_OFFSITE_DISKS="yandex_disk"
# Пол правдоподобия, МиБ. Существует из-за замера 19-08-2026: на yandex_disk
# лежали ДВА обрезка по 11.7 МиБ — остатки оборвавшихся загрузок 1.4-ГиБ архива
# (HTTP 413, затем «Empty reply from server»). `backup:monitor` называл это
# назначение ЗДОРОВЫМ, потому что смотрел только на дату. Проверка возраста без
# проверки размера — зелёная лампочка над пустым сейфом.
# Эпоха частей (23-08-2026): архив делится на части по max_part_mb=50 и льётся
# в реверсе, так что новейший файл — гарантированно ПОЛНАЯ часть ~50 МиБ.
# Порог = пол этой величины: ловит обрезки, пропускает полноценные части.
BACKUP_MIN_ARCHIVE_MB=40
