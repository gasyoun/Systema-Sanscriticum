#
# server_guards.conf — единственное место, где живут ЧИСЛА предохранителей прода.
#
# Читается двумя потребителями и только ими:
#   • scripts/server_guards_apply.sh  — подставляет значения в шаблоны и применяет
#   • php artisan guards:verify       — сверяет живую машину с этими значениями
#
# Формат сознательно беден: KEY=value, одна пара на строку, значение можно
# обернуть в двойные кавычки, «#» начинает комментарий только в начале строки.
# Никаких $-подстановок, никаких обратных кавычек, никаких многострочных
# значений — иначе PHP-парсер и bash разошлись бы в понимании одного файла.
#
# Разбор аварий 23–24.07 и 28–29.07.2026 — docs/server-resource-guards.md.
# Значения ниже сняты с живого прода 30-07-2026 (H1914).
#

# ── Приложение ───────────────────────────────────────────────────────────────
APP_DIR=/var/www/html
APP_USER=www-data
PHP_VERSION=8.3
PHP_BIN=/usr/bin/php

# ── Планировщик (обёртка вместо голого schedule:run) ─────────────────────────
# Потолок выше самой долгой штатной команды (telegram-harvest:roster-groups, 600 с).
SCHEDULE_MAX_SECONDS=900

# ── Сторожевые строки cron: своя судьба, свой замок, свой таймаут ────────────
WATCHDOG_CABINET_SCHEDULE="*/15 * * * *"
WATCHDOG_CABINET_MAX_SECONDS=120
WATCHDOG_HEARTBEAT_SCHEDULE="*/5 * * * *"
WATCHDOG_HEARTBEAT_MAX_SECONDS=60

# ── Потолки памяти. ЧИСЛА ЖИВУТ ТОЛЬКО ЗДЕСЬ ────────────────────────────────
# Ловушка, на которую наступили 29-07: два drop-in-файла, задающих MemoryMax,
# дают эффективное значение по порядку сортировки имён, а не по замыслу. Поэтому
# числа памяти для юнита пишет РОВНО ОДИН файл (memory-cap.conf), а
# 99-systema-limits.conf добавляет только то, чего в нём нет. guards:verify
# проверяет это отдельной проверкой (single-definition).
CRON_MEMORY_HIGH=2G
CRON_MEMORY_MAX=3G
CRON_TASKS_MAX=200
SUPERVISOR_MEMORY_HIGH=3G
SUPERVISOR_MEMORY_MAX=4G
LIMIT_NOFILE=65535

# ── Демон MadelineProto: свой юнит, свой бюджет (H3121, 19-08-2026) ─────────
# Раньше демон жил в cgroup того, кто его первым попросил — то есть под кроном,
# за счёт CRON_MEMORY_HIGH. Разросшись, он тормозил ВСЮ группу: авто-деплой,
# планировщик, оба сторожа. Теперь его поднимает systema-madeline-daemon.service,
# и эти числа — его собственный потолок. Здоровый демон ~106 МиБ.
MADELINE_MEMORY_HIGH=768M
MADELINE_MEMORY_MAX=1G
MADELINE_TASKS_MAX=64
# Потолки, по которым надзор (telegram-support:daemon) сам гасит демона, не
# дожидаясь ядра. Безопасны ровно потому, что демон теперь свой: его перезапуск
# не задевает ни cron, ни supervisor.
MADELINE_DAEMON_MAX_RSS_MB=700
# Течь ~1 дескриптор на подключение клиента (vendor-дефект MadelineProto, чинить
# в vendor нельзя) — при крон-минутке это ~1440 в сутки. 2000 ≈ полтора дня.
MADELINE_DAEMON_MAX_FDS=2000
MADELINE_DAEMON_MAX_AGE_HOURS=12
MADELINE_DAEMON_CHECK_SECONDS=60
# Возраст отметки systema-schedule-run.sh, после которого планировщик считается
# мёртвым. 15 минут — четверть часа тишины при штатном такте раз в минуту;
# 19-08-2026 тишина длилась семь часов и никто её не заметил.
SCHEDULER_STAMP_MAX_MINUTES=15

# ── PHP ─────────────────────────────────────────────────────────────────────
# Было -1: один artisan-процесс мог съесть весь контейнер. Штатный рабочий
# набор этих процессов ~100 МБ.
PHP_CLI_MEMORY_LIMIT=768M
FPM_MAX_CHILDREN=12
FPM_MAX_REQUESTS=500

# ── earlyoom: убить раньше, чем ядро уйдёт в livelock ───────────────────────
EARLYOOM_REPORT_INTERVAL=60
EARLYOOM_TERM_PERCENT=10
EARLYOOM_KILL_PERCENT=5
EARLYOOM_AVOID_RE="^(systemd|mariadbd|nginx|sshd|redis-server|supervisord|init|systemd-journal)$"
EARLYOOM_PREFER_RE="^php[0-9.]*$"

# ── Наблюдаемость ───────────────────────────────────────────────────────────
MEMWATCH_THRESHOLD_PCT=25
JOURNAL_MAX_USE=3G
JOURNAL_KEEP_FREE=2G
JOURNAL_MAX_FILE_SIZE=128M
JOURNAL_RETENTION=180day
SYSSTAT_HISTORY_DAYS=31
LOGROTATE_KEEP_DAYS=21
LOGROTATE_MAX_SIZE=50M

# ── Авто-деплой (H1933) ─────────────────────────────────────────────────────
# Каждые 30 минут root-cron сверяет HEAD с origin/main и, если отстал, зовет
# deploy.sh через обёртку systema-auto-deploy-run.sh. Любой провал деплоя или
# пост-деплойной проверки здоровья ставит предохранитель
# storage/auto_deploy.disabled — авто-деплой останавливается до разбора
# человеком (файл удалить руками), guards:verify кричит critical.
AUTO_DEPLOY_SCHEDULE="*/30 * * * *"
# Потолок одного прогона: npm build + composer на этом железе ~5–10 мин; 25 мин
# оставляет запас и гарантированно освобождает замок до следующего слота.
AUTO_DEPLOY_MAX_SECONDS=1500
# Минимум MemAvailable после деплоя — ниже значит деплой раздул память
# (класс аварий 23-07/28-07-2026).
AUTO_DEPLOY_MIN_AVAILABLE_MB=1024
AUTO_DEPLOY_SMOKE_URL=https://samskrte.ru/
# H2149 — само-перепроверка МЯГКОГО предохранителя ([blocked-preflight],
# [blocked-dirty], [timeout-alive], [rolled-back]). Жёсткого (без метки) не
# касается: тот ждёт человека, как и ждал.
# Пауза перед повтором, минут. 30 = следующий слот крона: раньше смысла нет,
# позже — прод стоит дольше, чем нужно.
AUTO_DEPLOY_RETRY_AFTER_MINUTES=30
# Сколько само-снятий подряд разрешено, прежде чем условие признаётся
# неизлечимым и отдаётся человеку. 3 ≈ полтора часа попыток: лечится само —
# уложится, не лечится — перестанем крутиться и скажем об этом прямо.
# Обнуляется ТОЛЬКО успешным деплоем.
AUTO_DEPLOY_MAX_AUTO_RETRIES=3

# ── Юниты, которые обязаны быть active ──────────────────────────────────────
# Через запятую. Пропажа любого из них — тревога, а не наблюдение.
REQUIRED_ACTIVE_UNITS="cron,supervisor,rsyslog,earlyoom,systema-madeline-daemon"
REQUIRED_ACTIVE_TIMERS="memwatch.timer,sysstat-collect.timer"
