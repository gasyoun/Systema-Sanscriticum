#
# server_guards_n8n.conf — единственное место, где живут ЧИСЛА предохранителей
# машины .91 (samskrtam50): n8n + Caddy в Docker, автоматизация, НЕ PHP-прод.
#
# Читается двумя потребителями и только ими:
#   • scripts/server_guards_apply.sh --profile n8n  — подставляет значения и применяет
#   • scripts/server_guards_n8n_verify.sh           — сверяет живую машину с этими значениями
#
# Формат тот же, что у server_guards.conf, и сознательно так же беден:
# KEY=value, одна пара на строку, никаких $-подстановок и обратных кавычек.
#
# Значения ниже сняты с живой .91 25-08-2026 (H3182, волна 2).
#

# ── Машина ───────────────────────────────────────────────────────────────────
# Каталог, куда выкладываются сами предохранители. На .91 НЕТ клона репозитория
# (замер 25-08-2026: ни одного .git), и заводить его там ради этого не нужно —
# H3177/H3178 выкладывались тем же способом, простым копированием. Отсюда же
# ходит почасовая проверка, поэтому путь должен быть стабильным, а не /tmp.
GUARDS_STAGING_DIR=/opt/systema-guards
N8N_DIR=/opt/n8n
N8N_CONTAINER=n8n-n8n-1
CADDY_CONTAINER=n8n-caddy-1
N8N_HEALTH_URL=http://127.0.0.1:5678/healthz

# ── Потолки контейнеров. ЧИСЛА ЖИВУТ ТОЛЬКО ЗДЕСЬ ───────────────────────────
# Спайк S3 (обязательный по замыслу волны): предел выбирается ПО ЗАМЕРУ, а не
# по вкусу — заниженный превращает улучшение аптайма в аварию.
#
# Замер 25-08-2026, ядро (cgroup v2), а не мгновенный снимок docker stats:
#   n8n-n8n-1   memory.peak = 1 340 350 464 B = 1278 МиБ за сутки работы
#               (контейнер поднят 24-08 11:57), memory.events oom=0, oom_kill=0,
#               restarts=0, pids.peak=27
#   n8n-caddy-1 memory.peak =    81 121 280 B =   77 МиБ за ЧЕТЫРЕ недели
#               (поднят 25-07), oom=0, pids.peak=26
#
# Потолок n8n = 3G ≈ 2.4× замеренного суточного пика. Это НЕ тесная посадка:
# смысл потолка — чтобы разогнавшийся контейнер не забрал всю машину (8 ГиБ),
# а не чтобы экономить память. Упрётся штатная нагрузка — ПОДНЯТЬ здесь,
# записать замер и применить заново; снимать потолок нельзя.
N8N_MEMORY_LIMIT=3G
N8N_MEMORY_RESERVATION=1G
N8N_PIDS_LIMIT=256
# Caddy отдаёт статику и терминирует TLS; 512M ≈ 6.6× четырёхнедельного пика.
CADDY_MEMORY_LIMIT=512M
CADDY_MEMORY_RESERVATION=64M
CADDY_PIDS_LIMIT=128

# ── Пин образа Caddy ────────────────────────────────────────────────────────
# Было `caddy:latest`. Замер 25-08-2026: живой образ — v2.11.4, собран
# 22-06-2026, digest sha256:af5fdcd7… Пин снят с УЖЕ РАБОТАЮЩЕГО образа, то есть
# сегодня он ничего не меняет и лишь фиксирует статус-кво; менять версию —
# отдельный осознанный шаг человека с `docker compose pull`.
# Ту же дыру для n8n закрыли 01-08-2026 (H1961, находка C07); Caddy тогда
# остался незакрытым и так и стоял «latest» четыре недели.
CADDY_IMAGE_PIN="caddy:2.11.4@sha256:af5fdcd76f2db5e4e974ee92f96ee8c0fc3edb55bd4ba5032547cbf3f65e486d"

# ── Healthcheck ──────────────────────────────────────────────────────────────
# /healthz проверен живым 25-08-2026: HTTP 200.
N8N_HEALTHCHECK_INTERVAL=30s
N8N_HEALTHCHECK_TIMEOUT=5s
N8N_HEALTHCHECK_RETRIES=3
N8N_HEALTHCHECK_START_PERIOD=60s

# ── earlyoom: убить раньше, чем ядро уйдёт в livelock ───────────────────────
# Список --avoid тут ДРУГОЙ, чем на .92, и это не косметика. На .92 избегают
# php-fpm/nginx/mariadb; здесь машину держат dockerd, containerd и sshd, а
# продукт — node (n8n) и caddy. Убить любой из них — снять автоматизацию,
# ничего не починив.
#
# --prefer выбран по замеру: 7.3 ГиБ в /tmp/hindi_audio и 452 МиБ /tmp/whisvenv
# оставлены ASR-конвейером, и именно этот класс процессов здесь разгоняется.
# Контейнеры в --prefer НЕ попадают сознательно: у них теперь свой cgroup-потолок,
# и разогнавшийся n8n упрётся в него, а не в earlyoom.
EARLYOOM_REPORT_INTERVAL=60
EARLYOOM_TERM_PERCENT=10
EARLYOOM_KILL_PERCENT=5
EARLYOOM_AVOID_RE="^(systemd|dockerd|containerd|containerd-shim|sshd|caddy|node|systemd-journal|init|restic)$"
EARLYOOM_PREFER_RE="^(python[0-9.]*|ffmpeg|whisper)$"

# ── Наблюдаемость ───────────────────────────────────────────────────────────
# На 25-08-2026 у машины НЕ БЫЛО памяти о собственной памяти: ни sysstat, ни
# memwatch, ни крона. Разбирать аварию было бы нечем.
MEMWATCH_THRESHOLD_PCT=25
JOURNAL_MAX_USE=2G
JOURNAL_KEEP_FREE=2G
JOURNAL_MAX_FILE_SIZE=128M
JOURNAL_RETENTION=180day
SYSSTAT_HISTORY_DAYS=31

# ── Docker: ротация логов контейнеров ───────────────────────────────────────
# /etc/docker/daemon.json отсутствовал: json-file по умолчанию НЕ ротируется,
# и лог растёт до заполнения диска. Сейчас логи скромные (3.1 МиБ + 1.6 МиБ) —
# ставим потолок ДО того, как он понадобится.
DOCKER_LOG_MAX_SIZE=50m
DOCKER_LOG_MAX_FILE=5

# ── /tmp ────────────────────────────────────────────────────────────────────
# ЧЕСТНО: потолок tmpfs изнутри гостя НЕ СТАВИТСЯ. Замер 25-08-2026:
#   findmnt -no OPTIONS /tmp -> rw,nosuid,nodev,nr_inodes=1048576,uid=100000,gid=100000
# Чужой uid= в опциях — маркер того, что tmpfs смонтирован ХОСТОМ Proxmox через
# idmap LXC, вне пространства имён контейнера. df показывает 126 ГиБ — половину
# памяти ХОСТА (252 ГиБ), а не гостя (8 ГиБ). Ни remount, ни drop-in tmp.mount.d,
# ни fstab здесь не действуют: ровно та же стена, что и на .92 (H3181), и лечится
# она только со стороны хоста — P5 плана, задача Артёма.
# Поэтому TMP_TMPFS_SIZE тут НЕТ: писать число, которое ничего не задаёт, значило
# бы завести зелёную лампочку над неработающим предохранителем.
#
# Что РАБОТАЕТ и потому поставлено: правило старения. 10 суток — паритет с .92 и
# со стоковым правилом Debian. Снижение (3 суток поймали бы hindi_audio на неделю
# раньше) — решение человека, а не агента: это автоматическое удаление чужих
# файлов. Тот же незакрытый вопрос, что и на .92.
TMP_AGE_DAYS=10
TMP_TMPFS_MODE=1777

# ── Резервные копии n8n (W2c) ───────────────────────────────────────────────
# Замер 25-08-2026: у .91 НЕТ резервной копии собственных данных. Restic-репозиторий
# /srv/restic/systema, живущий на этой машине, — это ПРИЁМНИК для .92
# (снимки хоста samskrtam150, теги systema/samudra), а не копия .91.
# Локальные дампы в /opt/n8n/backups разовые и ручные: новейший 24-08 15:26,
# 1.2 ГиБ разнородных файлов, расписания нет.
N8N_BACKUP_DIR=/var/backups/n8n
N8N_BACKUP_SCHEDULE="*-*-* 03:17:00"
N8N_BACKUP_KEEP=14
# Возраст новейшего дампа, после которого он считается протухшим.
N8N_BACKUP_MAX_AGE_HOURS=30
# Пол правдоподобия, МиБ. Порог ловит обрезки оборвавшихся дампов, а не
# полноценную копию: та же болезнь, что нашли на yandex_disk у .92, где два
# обрезка по 11.7 МиБ назывались здоровым бэкапом (H3181).
#
# ЧИСЛО СНЯТО С ПЕРВОГО ЖЕ ПРОГОНА, а не выведено из размера базы. Первая версия
# этого файла ставила 100 МиБ «по размеру живой базы» (166 МиБ) — и проверка
# честно уронила первый прогон: архив ГЗИПОВАН, 166 МиБ базы дают 31 МиБ архива.
# Порог, выведенный из несжатого размера, сравнивался со сжатым — сравнение было
# бессмысленным, и хорошо, что оно упало громко, а не пропустило.
# 15 ≈ половина замеренных 31 МиБ: ловит обрезок, пропускает полноценный архив.
# Настоящая защита от «архива ни о чём» — не размер, а проверка содержимого
# выше по скрипту (integrity_check + сверка workflow_entity с живой базой).
N8N_BACKUP_MIN_MB=15
# Off-site назначение. ПУСТО СОЗНАТЕЛЬНО, и это единственный незакрытый пункт
# волны 2 — verify обязан кричать об этом critical'ом, пока строка пуста.
#
# ЧТО ЗАМЕРЕНО 25-08-2026, а не предположено:
#   • Машины говорят по ЧАСТНОЙ сети, а не по публичным адресам: .91 это
#     192.168.200.91, .92 — 192.168.200.92. Публичный порт 22 между ними закрыт
#     в обе стороны (connection timed out) — именно поэтому «пути нет» было бы
#     неверным выводом из первой же проверки.
#   • Путь .91 -> 192.168.200.92 РАБОТАЕТ на уровне сети: ssh отвечает
#     «Permission denied (publickey)», то есть TCP и рукопожатие состоялись, не
#     хватает только авторизованного ключа.
#   • Обратное направление уже налажено и человеком одобрено: .92 льёт снимки
#     на .91 как sftp:restic-push@192.168.200.91:/systema (13 снимков, теги
#     systema/samudra), плюс существует лань S3 Yandex Cloud (H3175,
#     ключ намеренно PutObject-only, удалять не может).
#
# ПОЧЕМУ АГЕНТ НЕ ПОДКЛЮЧИЛ САМ. Оба маршрута упираются в СЕКРЕТ, который
# агенту трогать нельзя (PLAN §4: «не читать, не писать и не копировать
# значения секретов»): маршрут на .92 требует авторизовать новый ключ, маршрут
# в S3 — положить /root/.restic-s3.env с ключами доступа. Ни то, ни другое не
# делается молча между двумя продовыми машинами.
#
# ВАЖНО ПРО «OFF-SITE» БУКВАЛЬНО. .91 и .92 — гости ОДНОГО хоста Proxmox.
# Копия с .91 на .92 переживёт потерю контейнера, но НЕ потерю железа. Поэтому
# предпочтительный вариант — S3 (действительно вне площадки), а .92 — только
# как быстрый второй экземпляр.
#
# РЕШЕНИЕ ЧЕЛОВЕКА 25-08-2026: маршрут «сосед .92» (не S3), плюс отдельная
# локальная копия на рабочую машину. Подключено в тот же день.
#
# Как устроен доступ и почему именно так. Ограда волны (PLAN §4) запрещает
# трогать sshd_config вне волны 4, а на .92 нет ни одного Match-блока — значит
# чрут, каким .91 принимает .92, здесь недоступен. Ограничение вынесено в две
# вещи, которые живут ВНЕ sshd_config:
#   • выделенный НЕпривилегированный пользователь restic-n8n на .92, владеющий
#     только /srv/restic-n8n (0700). Права root по этому ключу не выдаются;
#   • forced-command в его authorized_keys: restrict,command="…/sftp-server" —
#     по ключу нельзя запустить ничего, кроме sftp-сервера.
# Ключ /root/.ssh/id_restic_n8n на .91 заведён ОТДЕЛЬНО от id_drill_tunnel
# (H3178): расширять намеренно суженный ключ было бы хуже, чем добавить свой.
# Алиас backup92 в /root/.ssh/config, чтобы новый ключ применялся только к этому
# назначению и не влиял на остальные ssh-вызовы root'а, включая живой
# systema-drill-tunnel.
#
# ЧЕСТНО ПРО ГРАНИЦЫ ЭТОЙ КОПИИ. .91 и .92 — гости ОДНОГО хоста Proxmox. Копия
# переживёт потерю контейнера, порчу базы и ошибку оператора, но НЕ потерю
# железа. Это осознанный выбор человека 25-08-2026, а не недосмотр; вторая
# линия обороны от потери железа — локальная копия на рабочей машине
# (scripts/pull_n8n_backup.ps1), третьей (S3) сегодня нет.
N8N_BACKUP_OFFSITE_REPO="sftp:backup92:/srv/restic-n8n/n8n"
N8N_BACKUP_OFFSITE_PASSFILE=/root/.restic-pass-n8n
# Сколько снимков держать на .92. 30 суток при суточном такте: заметно длиннее
# локальных 14 архивов, потому что удалённая копия и существует ради случая
# «беду заметили не сразу».
N8N_OFFSITE_KEEP_DAILY=30

# ── Юниты, которые обязаны быть active ──────────────────────────────────────
REQUIRED_ACTIVE_UNITS="docker,earlyoom,ssh"
REQUIRED_ACTIVE_TIMERS="memwatch.timer,sysstat-collect.timer,n8n-backup.timer,n8n-guards-verify.timer"
