version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Europe/Moscow
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    # .github/workflows/codeql.yml pins init + autobuild + analyze to ONE SHA,
    # and the action aborts when its config version and runtime version differ
    # ("Loaded a configuration file for version X, but running version Y").
    # Dependabot treats every action subpath as its own dependency, so an
    # ungrouped bump opens one PR per subpath, each moving a single pin and
    # leaving the other two behind — all of them then fail the *required*
    # `Analyze (javascript)` check by construction, with no re-run or
    # branch-update able to save them (see v1.89.5: PRs #1584, #1585, #1586
    # closed unmerged, superseded by #1594). Grouping makes the next bump
    # arrive as one PR that moves all three pins together.
    # Two entries because `applies-to` defaults to version-updates only, and a
    # CodeQL *security* bump would otherwise split the same way.
    groups:
      codeql-action:
        applies-to: version-updates
        patterns:
          - "github/codeql-action*"
      codeql-action-security:
        applies-to: security-updates
        patterns:
          - "github/codeql-action*"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Europe/Moscow
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7

  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Europe/Moscow
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7

  # H2479: root npm Dependabot never opened version-update PRs for the
  # Capacitor wrapper or the lecture-builder sidecar, even though security
  # alerts #18–#27 / #38–#41 already fired on those manifests. Same cadence
  # and cooldown as the root ecosystems so auto-merge (H2476) can take them.
  - package-ecosystem: npm
    directory: /mobile
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Europe/Moscow
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7

  - package-ecosystem: pip
    directory: /lecture-builder
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Europe/Moscow
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
