name: CodeQL

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 3 * * 1'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # ВНИМАНИЕ: CodeQL НЕ поддерживает PHP (языки: c/cpp, c#, go, java/kotlin,
        # javascript/typescript, python, ruby, swift). 'php' в матрице приводил к
        # «Did not recognize the following languages: php» и красному чек-job
        # `Analyze (php)` на КАЖДОМ PR. Для PHP-SAST нужен сторонний инструмент
        # (напр. Psalm/PHPStan taint-анализ), не CodeQL.
        language:
          - 'javascript'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: "/language:${{ matrix.language }}"
