name: CodeQL

# DISPATCH-ONLY since 30-10-2026: every CodeQL run on this PRIVATE repo
# activates Advanced Security usage billing (~$49 x each active committer
# per month) — that was the bulk of the $210 October bill. PHP SAST coverage
# continues via semgrep.yml (free minutes). Run manually for deep scans and
# expect the GHAS line item for that month.
on:
  workflow_dispatch: {}

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # ВНИМАНИЕ: CodeQL НЕ поддерживает PHP (языки: c/cpp, c#, go, java/kotlin,
        # javascript/typescript, python, ruby, swift). 'php' в матрице приводил к
        # «Did not recognize the following languages: php» и красному чек-job
        # `Analyze (php)` на КАЖДОМ PR. Для PHP-SAST нужен сторонний инструмент
        # (напр. Psalm/PHPStan taint-анализ), не CodeQL.
        language:
          - 'javascript'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: "/language:${{ matrix.language }}"
