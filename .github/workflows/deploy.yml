name: Deploy production

# Опция A из SYSTEMA_DEPLOY_GATE_FACTS_OPTIONS_2026H2.md (H478), одобрена MG:
# GitHub Actions -> SSH -> deploy.sh, гейт — approval-правило GitHub Environment
# "production" (ревьюер MG). Никакие агентские креды прода этот workflow не
# держит: SSH-ключ живет только в секретах Environment "production", которые
# заводит человек (Иван/MG) в настройках репозитория — см. docs/deploy.md
# §CI/CD.
#
# Прод по расписанию по-прежнему доставляет серверный cron через deploy.sh.
# Этот SSH-путь — только ручной аварийный/операторский запуск с тем же
# Environment approval; merge/push сам по себе его не ставит в очередь.

on:
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: SSH -> deploy.sh (production)
    runs-on: ubuntu-latest
    # Требует Environment "production" с обязательным ревьюером (MG) и
    # секретами DEPLOY_HOST / DEPLOY_USER / DEPLOY_SSH_KEY — заводится в
    # Settings -> Environments человеком, не этим PR. См. docs/deploy.md.
    environment: production
    steps:
      # workflow_dispatch only — failing loudly cannot redden main on push
      # (H1355 concern no longer applies). Missing secrets must surface as a red
      # job, not a silently-green skip that looks like a successful deploy.
      - name: Check deploy secrets present
        run: |
          ok=1
          [ -z "${{ secrets.DEPLOY_HOST }}"    ] && { echo "::error::DEPLOY_HOST secret missing — add to Settings → Environments → production"; ok=0; }
          [ -z "${{ secrets.DEPLOY_USER }}"    ] && { echo "::error::DEPLOY_USER secret missing — add to Settings → Environments → production"; ok=0; }
          [ -z "${{ secrets.DEPLOY_SSH_KEY }}" ] && { echo "::error::DEPLOY_SSH_KEY secret missing — add to Settings → Environments → production"; ok=0; }
          [ "$ok" = 0 ] && exit 1
          echo "All deploy secrets present"

      - name: Configure SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts
          [ -s ~/.ssh/known_hosts ] || { echo "::error::known_hosts empty after ssh-keyscan — DEPLOY_HOST may be unreachable"; exit 1; }

      - name: Run deploy.sh over SSH
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            'sudo /var/www/html/deploy.sh'
