name: CI

# Systema Sanscriticum — Laravel 12 / PHP 8.3 / Vite 8 + Tailwind 4.
# phpunit.xml already sets DB_CONNECTION=sqlite DB_DATABASE=:memory: for tests.
# SQLite remains the fast primary suite; a separate MySQL 8.4 job exercises
# production-only migrations and transaction/locking behavior.

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-tests:
    name: PHP ${{ matrix.php }} — tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Прод на 8.3 (05-07-2026, docs/php-8.3-upgrade.md); require php ^8.3,
        # danog/madelineproto требует >=8.2.14 — старые версии из матрицы убраны.
        php: ["8.3"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, xml, pdo, sqlite, pdo_sqlite, redis, curl, zip, pcntl, posix
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: vendor
          key: php-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: php-${{ matrix.php }}-

      - name: Composer install
        run: composer install --no-interaction --prefer-dist --no-progress --optimize-autoloader

      - name: Composer platform requirements
        run: composer check-platform-reqs

      - name: Composer security audit (locked dependencies)
        run: composer audit --locked

      - name: Set up environment
        run: |
          cp .env.example .env
          # Override to SQLite for CI (phpunit.xml already does this for tests,
          # but artisan commands before the test run need a DB too)
          sed -i 's/DB_CONNECTION=mysql/DB_CONNECTION=sqlite/' .env
          sed -i 's/DB_DATABASE=laravel/DB_DATABASE=\/tmp\/ci.sqlite/' .env
          php artisan key:generate

      - name: Run migrations
        run: php artisan migrate --force --no-interaction

      - name: Stub Vite manifest for tests
        # @vite() in views throws ManifestNotFoundException (→ 500) if
        # public/build/manifest.json is absent or missing required entry keys.
        # Stub manifest with the two app entrypoints satisfies the Vite plugin
        # without requiring an actual frontend build.
        run: |
          mkdir -p public/build/assets
          cat > public/build/manifest.json << 'JSON'
          {
            "resources/css/app.css": { "file": "assets/app.css", "src": "resources/css/app.css", "isEntry": true },
            "resources/js/app.js":  { "file": "assets/app.js",  "src": "resources/js/app.js",  "isEntry": true }
          }
          JSON
          touch public/build/assets/app.css public/build/assets/app.js

      - name: Laravel Pint format check
        run: ./vendor/bin/pint --test

      - name: PHPUnit tests
        # --no-interaction is a Laravel artisan flag but PHPUnit 10 rejects it
        # GUIDE_SHOTS_OPTIONAL: Playwright не в CI (решение 15 плана гидов).
        # Нет кадров — skip файловой проверки, не красный прогон и не фейковые PNG.
        env:
          GUIDE_SHOTS_OPTIONAL: "1"
        run: php artisan test --parallel

  frontend-build:
    name: Frontend build (Vite + Tailwind)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "20.19"
          cache: npm

      - name: npm ci
        run: npm ci

      - name: npm security audit (including dev dependencies)
        run: npm audit

      - name: Vite build
        run: npm run build

  mobile-npm-audit:
    name: Mobile npm security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "20.19"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: npm security audit (mobile lockfile)
        working-directory: mobile
        run: npm audit --package-lock-only

  mysql-finance-tests:
    name: MySQL 8.4 — finance/webhook transactions
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: systema_test
          MYSQL_USER: systema
          MYSQL_PASSWORD: systema
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: systema_test
      DB_USERNAME: systema
      DB_PASSWORD: systema
      RUN_MYSQL_CONCURRENCY_TESTS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.3"
          extensions: mbstring, xml, pdo, pdo_mysql, redis, curl, zip, pcntl, posix
          coverage: none

      - name: Composer install
        run: composer install --no-interaction --prefer-dist --no-progress --optimize-autoloader

      - name: Set up Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: MySQL migrate:fresh
        run: php artisan migrate:fresh --force --no-interaction

      - name: MySQL finance and webhook transaction tests
        run: >-
          php artisan test
          --filter='TochkaWebhookTest|MutualSettlementTest|FinanceIdempotencyTest|FinanceLockingMySqlTest'

  changelog-lint:
    name: Changelog — no duplicated bullets
    runs-on: ubuntu-latest
    # Guards the failure class behind PR #827: a single edit anchored on a
    # repeated heading fanned one bullet across 52 sections, unreviewably
    # (every copy byte-identical to the legitimate one).
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: python scripts/changelog_duplicate_bullets.py

  changelog-release-coverage:
    name: Changelog — every version tagged and released
    runs-on: ubuntu-latest
    # A CHANGELOG heading is written by the release commit, so a session that
    # stops after the commit leaves a version that reads as shipped in every
    # document that matters and exists nowhere in `git tag` or the releases
    # page. H3692's own v1.90.35 sat untagged for four days while CHANGELOG.md
    # and RESULTS_LOG.md both linked to its 404 release page; the 03-09-2026
    # backfill found ten more in the same state. Nothing read back the other
    # direction until this job.
    steps:
      # fetch-depth: 0 is load-bearing — the default (1) fetches NO tags, and
      # the gate would then see zero tags. The script exits 2 with that
      # diagnosis rather than reporting 279 phantom gaps, but the job still
      # needs the real tags to say anything useful.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      # The releases half needs only `contents: read`, already granted at the
      # top of this file — no PAT, no repo secret. Without GH_TOKEN the script
      # degrades to a tags-only check and says «UNKNOWN» rather than passing a
      # false all-clear.
      - env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/changelog_release_coverage.py --check

  teacher-guide-freshness:
    name: Teacher guide — freshness warning
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    # Предупреждение, НЕ блокировка (H2501, решение R11): правка наблюдаемого
    # файла бывает чисто внутренней и текста руководства не требует. Блок
    # заставлял бы дописывать в документ пустую строку ради зелёного CI.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Warn when teacher-visible files moved without the guide
        run: >-
          git diff --name-only
          ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}
          | python scripts/teacher_guide_freshness.py

  student-guide-freshness:
    name: Student guide — freshness warning
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Warn when student-visible files moved without the guide
        run: >-
          git diff --name-only
          ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}
          | python scripts/student_guide_freshness.py

  curator-guide-freshness:
    name: Curator guide — freshness warning
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Warn when curator-visible files moved without the guide
        run: >-
          git diff --name-only
          ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}
          | python scripts/curator_guide_freshness.py

  accountant-guide-freshness:
    name: Accountant guide — freshness warning
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Warn when finance-visible files moved without the guide
        run: >-
          git diff --name-only
          ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}
          | python scripts/accountant_guide_freshness.py

  yaml-lint:
    name: YAML lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: pip install pyyaml
      - run: |
          python -c "
          import sys, glob, yaml
          fail = 0
          for f in glob.glob('**/*.yml', recursive=True) + glob.glob('**/*.yaml', recursive=True):
              if any(x in f for x in ['.git', 'vendor/', 'node_modules/']): continue
              try:
                  yaml.safe_load(open(f, encoding='utf-8'))
              except yaml.YAMLError as e:
                  print(f'::error file={f}::{e}'); fail = 1
          sys.exit(fail)
          "

  mic-vendor-drift:
    name: Vendored message-intent-classifier drift check (pin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Read pinned SHA
        id: pin
        run: echo "sha=$(cat tools/message-intent-classifier/PINNED_SHA)" >> "$GITHUB_OUTPUT"
      # gasyoun/message-intent-classifier is PRIVATE: GITHUB_TOKEN cannot read it.
      # The full tree-parity gate activates the moment a fine-grained read-only
      # PAT (contents:read on that repo) is added as the MIC_UPSTREAM_TOKEN
      # Actions secret; until then only JSON freshness + pin sanity run.
      - name: Resolve upstream access
        id: access
        env:
          MIC_UPSTREAM_TOKEN: ${{ secrets.MIC_UPSTREAM_TOKEN }}
        run: echo "token_set=$([ -n "$MIC_UPSTREAM_TOKEN" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Checkout upstream at pin
        if: steps.access.outputs.token_set == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: gasyoun/message-intent-classifier
          ref: ${{ steps.pin.outputs.sha }}
          token: ${{ secrets.MIC_UPSTREAM_TOKEN }}
          path: _upstream-mic
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: pip install pyyaml
      - name: Drift + generated-JSON parity check
        run: |
          if [ "${{ steps.access.outputs.token_set }}" = "true" ]; then
            python tools/check_mic_vendor_drift.py --upstream _upstream-mic
          else
            python tools/check_mic_vendor_drift.py --self-only
          fi

