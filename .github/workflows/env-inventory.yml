name: Environment inventory

# pull_request вернул 31-10-2026: #3628 урезал триггеры до weekly+dispatch,
# а контекст «Environment inventory» остался в required checks ветки main —
# каждый PR висел «Waiting for status to be reported». Джоб дешёвый
# (информационный снапшот окружения), на PR гонялся зелёным до #3628.
on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  inventory:
    name: Environment inventory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: "8.3"
          coverage: none
      - run: php scripts/generate_env_inventory.php --check
