name: Semgrep (PHP SAST)

# CodeQL cannot analyze PHP (see codeql.yml comment) — this is the actual static
# security gate for the language the whole app is written in. REQUIRED/blocking:
# the 18 advisory findings (H081 Part A) were triaged to zero on 13-07-2026 —
# GitHub Actions pinned to commit SHAs, dependabot cooldown added, the stray
# nginx default page removed — so the job now fails on any new finding.
# See docs/SECURITY_ROADMAP.md Wave 3.

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semgrep:
    name: Semgrep scan
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run Semgrep
        # Blocking scan (see header): `--error` makes the step exit non-zero on
        # any finding, so a new SAST issue turns the required check red. The
        # backlog of 18 advisory findings was cleared on 13-07-2026 before this
        # was promoted; to re-triage a noisy new rule, prefer a scoped
        # `# nosemgrep` or `.semgrepignore` entry over dropping `--error`.
        # `--exclude` keeps this a *PHP/source* gate: skip vendored, generated,
        # minified, and static-asset trees (minified filament/filepond JS, the
        # nginx default page, static marketing HTML, lecture-* microservice
        # output) that a source SAST has no business flagging.
        run: |
          semgrep scan \
            --error \
            --config p/php \
            --config p/security-audit \
            --config p/owasp-top-ten \
            --exclude vendor \
            --exclude node_modules \
            --exclude public \
            --exclude storage \
            --exclude bootstrap \
            --exclude lecture-ui \
            --exclude lecture-builder \
            --exclude tools/message-intent-classifier \
            --exclude '*.min.js' \
            --metrics=off
