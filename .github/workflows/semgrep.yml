name: Semgrep (PHP SAST)

# CodeQL cannot analyze PHP (see codeql.yml comment) — this is the actual static
# security gate for the language the whole app is written in. Advisory/non-blocking
# while the false-positive rate is triaged (H081 Part A); promote to required once
# clean, see docs/SECURITY_ROADMAP.md Wave 3.

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semgrep:
    name: Semgrep scan
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    # Advisory: findings are surfaced but do not fail the job/PR yet.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Run Semgrep
        # Advisory scan (see header): findings are printed in the job log but the
        # step exits 0 — NO `--error` — so this non-required check reads green
        # instead of a permanent red X on every PR while the false-positive rate
        # is triaged. To promote to a hard gate (Wave 3): re-add `--error` and
        # drop `continue-on-error` above once the owned findings are clean.
        # `--exclude` keeps this a *PHP/source* gate: skip vendored, generated,
        # minified, and static-asset trees (minified filament/filepond JS, the
        # nginx default page, static marketing HTML, lecture-* microservice
        # output) that a source SAST has no business flagging.
        run: |
          semgrep scan \
            --config p/php \
            --config p/security-audit \
            --config p/owasp-top-ten \
            --exclude vendor \
            --exclude node_modules \
            --exclude public \
            --exclude storage \
            --exclude bootstrap \
            --exclude lecture-ui \
            --exclude lecture-builder \
            --exclude '*.min.js' \
            --metrics=off
