name: Schedule guard reproduction test

# Harness for the shell guards under scripts/server_guards/sbin/. Each of these
# tests runs entirely in a temp dir with stubbed binaries — no prod access, no
# root, no secrets — so they are cheap to run on every touch.
#
# H1973 (30-07-2026): systema-schedule-run.sh's flock-based overlap guard once
# stayed falsely held for ~2h after a deploy restart, silently skipping every
# scheduled command. The fix added a TTL-based stale-lock reclaim, verified by
# scripts/server_guards/sbin/test_systema_schedule_run.sh. The test now also
# proves the wrapper never touches an unrelated Artisan-like process.
#
# H3579 (26-08-2026) added two more jobs. The remediation ladder's test was
# written with the ladder and would otherwise never have run in CI — a test that
# only ever runs on the author's machine protects the first week and nothing
# after it. The auto-deploy wrapper's test already existed and had simply never
# been wired here; it was green when wired, so the gap was luck, not design.
#
# Runs on every push/PR touching the guarded scripts, plus weekly so regressions
# surface even if the wrappers themselves haven't changed in a while.
#
# H5080-F1 (19-09-2026): the .91-side n8n verify parser (scripts/server_guards_n8n/)
# joined with its own job — the off-site snapshot "newest" bug drew a false
# critical for ~24 days while every nightly copy was landing.

on:
  push:
    branches: [master, main]
    paths:
      - "scripts/server_guards/sbin/**"
      - "scripts/server_guards_n8n/**"
  pull_request:
    branches: [master, main]
    paths:
      - "scripts/server_guards/sbin/**"
      - "scripts/server_guards_n8n/**"
  schedule:
    - cron: "17 3 * * 1" # weekly, Monday 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduction-test:
    name: flock stale-lock reclaim reproduction test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run test_systema_schedule_run.sh
        run: bash scripts/server_guards/sbin/test_systema_schedule_run.sh

  auto-deploy-guard-test:
    name: auto-deploy wrapper guards (fuse, retry cap, exit 75)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run test_systema_auto_deploy_run.sh
        run: bash scripts/server_guards/sbin/test_systema_auto_deploy_run.sh

  remediation-ladder-test:
    name: remediation ladder restraint (R4 inert, counter, gave-up)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Proves, among others, that R4 never reaches the Proxmox API without a
      # token — by the ABSENCE of the call, not by trusting the script text.
      - name: Run test_systema_remediation_ladder.sh
        run: bash scripts/server_guards/sbin/test_systema_remediation_ladder.sh

  ib-balance-watch-test:
    name: ib-balance pulse guard (fresh/stale/dedup/missing/garbage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Six cases, all in a temp dir with a stubbed lane_lib: the hourly page
      # dedup and the recovery reset are the two behaviours a silent regression
      # would otherwise hide (MG 14-09-2026: the watcher must page when the
      # box-side sweep dies, but never once per 15-min tick).
      - name: Run test_systema_ib_balance_watch.sh
        run: bash scripts/server_guards/sbin/test_systema_ib_balance_watch.sh

  n8n-verify-offsite-parser-test:
    name: n8n verify off-site parser (newest snapshot, not first JSON entry)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # H5080-F1 (19-09-2026): the .91 verify drew a false critical "newest
      # off-site snapshot 595 h old" while 26 nightly copies were live — the
      # parser took the FIRST JSON entry, and `--latest 1` returns every group
      # (each nightly archive has a unique path, so each is its own group).
      # The test extracts the pipeline from the verify script itself, so a
      # regression to `head -1` fails it by construction.
      - name: Run test_n8n_verify_offsite_parser.sh
        run: bash scripts/server_guards_n8n/sbin/test_n8n_verify_offsite_parser.sh
