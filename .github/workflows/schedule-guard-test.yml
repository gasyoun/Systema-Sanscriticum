name: Schedule guard reproduction test

# H1973 (30-07-2026): systema-schedule-run.sh's flock-based overlap guard once
# stayed falsely held for ~2h after a deploy restart, silently skipping every
# scheduled command. The fix added a TTL-based stale-lock reclaim, verified by
# scripts/server_guards/sbin/test_systema_schedule_run.sh. The test now also
# proves the wrapper never touches an unrelated Artisan-like process. Runs on
# every push/PR touching the guarded scripts, plus weekly so regressions in the
# reclaim and process-isolation logic surface even if the wrapper itself hasn't
# changed in a while.

on:
  push:
    branches: [master, main]
    paths:
      - "scripts/server_guards/sbin/systema-schedule-run.sh"
      - "scripts/server_guards/sbin/test_systema_schedule_run.sh"
  pull_request:
    branches: [master, main]
    paths:
      - "scripts/server_guards/sbin/systema-schedule-run.sh"
      - "scripts/server_guards/sbin/test_systema_schedule_run.sh"
  schedule:
    - cron: "17 3 * * 1" # weekly, Monday 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduction-test:
    name: flock stale-lock reclaim reproduction test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run test_systema_schedule_run.sh
        run: bash scripts/server_guards/sbin/test_systema_schedule_run.sh
