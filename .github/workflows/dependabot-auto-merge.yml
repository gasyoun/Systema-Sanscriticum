name: Dependabot auto-merge

# Hands-off merge of Dependabot patch/minor pull requests. `--auto` delegates
# the actual merge to GitHub, which waits for branch-protection requirements;
# there is deliberately no direct-merge fallback. Major bumps receive neither
# approval nor auto-merge and therefore require human review.
# Approve is best-effort: the repo/org toggle "Allow GitHub Actions to create
# and approve pull requests" is often off (Systema measured
# can_approve_pull_request_reviews=false on 14-08-2026). PR #1109 dropped
# `|| true` from Approve, so that setting failure aborted the job before
# Enable auto-merge (#1581/#1582/#1583, 10-08-2026). continue-on-error keeps
# Enable reachable. Deployed by /cologne-dependabot-automerge-all; Systema
# holds majors (unlike the cologne default).

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    name: Auto-merge Dependabot PRs
    runs-on: ubuntu-latest
    if: ${{ github.actor == 'dependabot[bot]' }}
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Approve the PR
        if: >-
          steps.meta.outputs.update-type == 'version-update:semver-patch' ||
          steps.meta.outputs.update-type == 'version-update:semver-minor'
        continue-on-error: true
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge after required checks
        if: >-
          steps.meta.outputs.update-type == 'version-update:semver-patch' ||
          steps.meta.outputs.update-type == 'version-update:semver-minor'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
