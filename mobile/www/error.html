<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Нет соединения — Кабинет самскрте</title>
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <main class="screen">
      <div class="icon" aria-hidden="true">⚡</div>
      <h1 class="title">Нет соединения</h1>
      <p class="msg">
        Не удалось загрузить кабинет. Проверьте интернет и попробуйте снова.
      </p>
      <button id="retry" class="btn" type="button">Повторить</button>
    </main>

    <script src="generated/env.js"></script>
    <script>
      (function () {
        var retry = document.getElementById('retry');
        retry.addEventListener('click', function () {
          var url = window.__CABINET_URL__;
          if (url) {
            window.location.replace(url);
          } else {
            window.location.reload();
          }
        });
      })();
    </script>
  </body>
</html>
