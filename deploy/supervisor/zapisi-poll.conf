; Track C (@zapisi_ORSbot): АВАРИЙНЫЙ приём апдейтов поллингом.
;
; ШТАТНО апдейты приходят ВЕБХУКОМ через входной узел (Telegram → зарубежный
; nginx → обратный SSH-туннель → прод). Эта программа нужна, только когда узел
; недоступен: поллинг ходит getUpdates по исходящему sshuttle-туннелю и не
; зависит от входящих соединений вовсе.
;
; ВНИМАНИЕ: запуск СНИМАЕТ вебхук (Telegram отдаёт апдейты ровно одним
; способом), то есть переключает дорожку. Поэтому:
;   - autostart=false — программа не поднимается сама;
;   - нужен флаг --release-webhook, без него команда откажется стартовать;
;   - нужен TELEGRAM_ZAPISI_POLL_ENABLED=true в .env;
;   - deploy.sh перезапускает её ТОЛЬКО если она уже RUNNING.
;
; Установка (один раз):
;   cp /var/www/html/deploy/supervisor/zapisi-poll.conf /etc/supervisor/conf.d/
;   supervisorctl reread && supervisorctl update
;
; Включить аварийно:  supervisorctl start zapisi-poll
; Вернуть вебхук:     supervisorctl stop zapisi-poll && php artisan telegram:webhooks --set
;
; Команда сама выходит раз в poll_max_lifetime_seconds (по умолчанию час), и
; supervisor поднимает свежий процесс, поэтому старый код не залипает.

[program:zapisi-poll]
process_name=%(program_name)s
command=php /var/www/html/artisan zapisi:poll --release-webhook
directory=/var/www/html
autostart=false
autorestart=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/html/storage/logs/zapisi-poll.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
; Долгий getUpdates: даём заходу дожить, а не рвём процесс посреди запроса —
; иначе принятые, но не подтверждённые апдейты придут повторно.
stopwaitsecs=75
stopsignal=TERM
