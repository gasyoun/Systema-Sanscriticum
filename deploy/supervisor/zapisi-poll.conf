; Track C (@zapisi_ORSbot): long polling апдейтов вместо вебхука.
;
; Почему демон, а не вебхук: Telegram не может достучаться до этого прода —
; входящие соединения из его подсетей не проходят, при том что сайт снаружи
; открывается и вебхуки Точки доходят (разбор — docs/telegram-userbot-inventory.md
; §4.3). Исходящий канал обеспечен tg-tunnel.service (sshuttle), поллинг ходит
; по нему и не зависит от проброса портов.
;
; Установка на проде (один раз):
;   cp /var/www/html/deploy/supervisor/zapisi-poll.conf /etc/supervisor/conf.d/
;   supervisorctl reread && supervisorctl update
;   supervisorctl status zapisi-poll
;
; Дальше рестарт делает deploy.sh вместе с horizon — руками трогать не нужно.
; Команда сама выходит раз в poll_max_lifetime_seconds (по умолчанию час), и
; supervisor поднимает свежий процесс, поэтому старый код не залипает.

[program:zapisi-poll]
process_name=%(program_name)s
command=php /var/www/html/artisan zapisi:poll
directory=/var/www/html
autostart=true
autorestart=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/html/storage/logs/zapisi-poll.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
; Долгий getUpdates: даём заходу дожить, а не рвём процесс посреди запроса —
; иначе принятые, но не подтверждённые апдейты придут повторно.
stopwaitsecs=75
stopsignal=TERM
